version: "2"

run:
  timeout: 5m
  build-tags:
    - integration
    - sim

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - wsl_v5
  exclusions:
    paths:
      - gen/

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/solidDoWant/vault-sync
