syntax = "proto3";

package vaultsync.v1;

import "google/protobuf/timestamp.proto";
import "vaultsync/v1/types.proto";

option go_package = "github.com/solidDoWant/vault-sync/gen/vaultsync/v1;vaultsyncv1";

// VaultKeyService stores the key epochs and key slots of end-to-end
// encrypted vaults (SPEC.md §9.3). An E2EE vault has one symmetric key per
// epoch; a key slot holds an epoch key wrapped (sealed) to one recipient: a
// member's user public key, or the deployment's escrow key. The server
// never sees an epoch key: it stores wrapped keys and key commitments as
// opaque bytes, and owner clients wrap them.
//
// Epochs are numbered from 1. A new E2EE vault has no epoch (current epoch
// 0) and a pending rotation; its first epoch is created by an owner client
// with RotateEpoch(expected_epoch = 0). Revisions must be committed under
// the vault's current epoch (CommitRevisionRequest.epoch).
//
// The recipients of an epoch: every member with a user key
// (UserKeyService), plus at most one escrow slot in a vault with escrow. A
// member without a user key cannot be wrapped to; once they create one they
// appear in ListMissingSlots for every epoch of the vault.
//
// ListKeySlots, ListEpochs and ListLogEntries are open to every member, and
// ListLogEntries also to the holder of a pending invitation's id; ListMissingSlots,
// RotateEpoch, AddKeySlots, ListStaleRevisions, ReplaceRevisionCiphertext,
// RetireEpoch and ConvertVault are owner-only (PERMISSION_DENIED for editors
// and viewers). A caller who is not a member gets NOT_FOUND, as for a vault
// that does not exist. On a plaintext vault the lists are empty, and
// RotateEpoch, AddKeySlots, ReplaceRevisionCiphertext and RetireEpoch are
// FAILED_PRECONDITION; ConvertVault turns a plaintext vault into an E2EE
// one.
service VaultKeyService {
  // ListKeySlots lists the caller's own key slots in the vault, in
  // ascending epoch order, or with recipient_kind KEY_RECIPIENT_KIND_ESCROW
  // the vault's escrow slots (one per epoch of an escrow vault), which a
  // client holding the escrow identity opens. No call returns another
  // member's slots.
  //
  // Errors: INVALID_ARGUMENT for a malformed page_token or recipient_kind;
  // PERMISSION_DENIED for escrow slots requested by a viewer.
  rpc ListKeySlots(ListKeySlotsRequest) returns (ListKeySlotsResponse) {}

  // ListEpochs lists the vault's epochs with their key commitments, in
  // ascending order, and returns the vault's key state.
  //
  // Errors: INVALID_ARGUMENT for a malformed page_token.
  rpc ListEpochs(ListEpochsRequest) returns (ListEpochsResponse) {}

  // ListMissingSlots lists, for every epoch of the vault, the members with
  // a user key who have no slot for it, with their public keys, so that an
  // owner client can wrap and grant them (AddKeySlots). Ordered by epoch,
  // then user id.
  //
  // Errors: INVALID_ARGUMENT for a malformed page_token.
  rpc ListMissingSlots(ListMissingSlotsRequest) returns (ListMissingSlotsResponse) {}

  // RotateEpoch creates the epoch after expected_epoch and clears the
  // vault's pending rotation. It is a compare-and-set: of concurrent calls
  // with the same expected_epoch exactly one succeeds.
  //
  // Errors: INVALID_ARGUMENT for out-of-bounds fields, or slots that are not
  // exactly the epoch's recipients (one per member with a user key, plus at
  // most one escrow slot in an escrow vault), a missing or unverifiable
  // epoch record or escrow entry (nothing changes); FAILED_PRECONDITION with an
  // ErrorDetail of reason ERROR_REASON_EPOCH_NOT_CURRENT when expected_epoch
  // is not the vault's current epoch (another rotation won: adopt it), and
  // without that reason for a plaintext vault.
  rpc RotateEpoch(RotateEpochRequest) returns (RotateEpochResponse) {}

  // AddKeySlots grants key slots for existing epochs, typically to a member
  // listed by ListMissingSlots. A slot already stored for the same epoch and
  // recipient is kept, never replaced; the response counts the slots added.
  // Nothing is stored unless every slot is valid.
  //
  // Errors: INVALID_ARGUMENT for out-of-bounds fields, an epoch the vault
  // does not have, a user who is not a member with a user key, duplicate
  // slots, or an escrow slot in a vault without escrow; FAILED_PRECONDITION
  // for a plaintext vault.
  rpc AddKeySlots(AddKeySlotsRequest) returns (AddKeySlotsResponse) {}

  // ListLogEntries lists the vault's membership log (docs/design/crypto.md)
  // in ascending seq order, from the genesis entry. A plaintext vault has
  // no log, so its list is empty.
  //
  // A caller who is not a member reads the log with invitation_id, the
  // `<id>` of a pending invitation to the vault, so that a newcomer can
  // verify the log from the invite anchor's genesis hash and sign its
  // redeem entry over the head (docs/design/encryption.md, "Redemption
  // takes two steps"). Members need no invitation_id.
  //
  // Errors: INVALID_ARGUMENT for a malformed page_token; NOT_FOUND, the
  // same as GetInvitationSlots returns, for a non-member's invitation_id
  // that is malformed, unknown, expired, revoked, redeemed or for another
  // vault.
  rpc ListLogEntries(ListLogEntriesRequest) returns (ListLogEntriesResponse) {}

  // ListStaleRevisions lists every retained revision of the vault that is
  // not on the current epoch, in ascending seq order: tombstones, folders
  // and conflict copies included. An owner's re-key job pages through it,
  // re-seals each revision under the current epoch and moves it with
  // ReplaceRevisionCiphertext (docs/design/encryption.md, "Re-encrypting
  // history"). Pages follow seq, which a rewrite does not change, so a
  // pass lists each stale revision once. A rotation during a pass makes
  // revisions already moved stale again: when current_epoch changes, the
  // job restarts from the first page. Empty on a plaintext vault.
  //
  // Errors: INVALID_ARGUMENT for a malformed page_token.
  rpc ListStaleRevisions(ListStaleRevisionsRequest) returns (ListStaleRevisionsResponse) {}

  // ReplaceRevisionCiphertext moves one stored revision from from_epoch to
  // to_epoch: it replaces the revision's sealed path and its content
  // reference with ones the owner's re-key job sealed under to_epoch
  // (docs/design/encryption.md, "Re-encrypting history"). It changes
  // nothing else: not the revision's id, seq, document or tombstone flag,
  // not the document's path_key, and not which revision is current. The
  // content it replaces is released, so the blob garbage collector deletes
  // it once no revision references it.
  //
  // It is conditional, under the vault row lock that commits and rotations
  // take: the rewrite is applied only while the revision is still at
  // from_epoch and to_epoch is the vault's current epoch. Otherwise it is
  // skipped and the response says so (replaced = false): the job restarts
  // with the newer target. A retry of an applied rewrite is skipped too.
  //
  // Errors: INVALID_ARGUMENT for out-of-bounds fields, from_epoch not below
  // to_epoch, content_ref given for a revision without content or missing
  // for one with content, or a content size that differs from the stored
  // blob's; NOT_FOUND for a revision the vault does not have;
  // FAILED_PRECONDITION for a content_ref that is not a complete blob in
  // the vault, and for a plaintext vault.
  rpc ReplaceRevisionCiphertext(ReplaceRevisionCiphertextRequest) returns (ReplaceRevisionCiphertextResponse) {}

  // RetireEpoch retires an epoch that no stored revision uses: it deletes
  // the epoch's key slots, for every recipient, and marks it retired. The
  // epoch's commitment and signed record stay (ListEpochs), so devices can
  // still verify the chain of epoch records. A retired epoch needs no
  // slots: ListMissingSlots skips it, and AddKeySlots, CreateInvitation
  // and RedeemInvitation accept slots for it but do not store them.
  // Retiring an epoch already retired succeeds and changes nothing.
  //
  // Errors: INVALID_ARGUMENT for epoch 0 or an epoch the vault does not
  // have; FAILED_PRECONDITION for epoch 1 (its key derives every path_key,
  // docs/design/encryption.md), for the vault's current epoch, while any
  // revision still uses the epoch, and for a plaintext vault.
  rpc RetireEpoch(RetireEpochRequest) returns (RetireEpochResponse) {}

  // ConvertVault converts a plaintext vault to end-to-end encryption in
  // place (docs/design/encryption.md, "Converting a plaintext vault in
  // place"). In one transaction, under the vault row lock that commits and
  // membership changes take, it stores the vault's membership log (genesis,
  // then the members entry), creates epoch 1 with its slots and signed
  // record, replaces the path_key of every live document with the
  // submitted HMAC path key, and switches the vault to
  // VAULT_ENCRYPTION_E2EE. Members, documents and history are kept. The
  // stored revisions stay at epoch 0, as plaintext, until the re-key job
  // moves them (ReplaceRevisionCiphertext). The members entry signs the
  // vault's head_seq the converting device read it at (converted_at_seq),
  // and the server converts only while its head_seq still equals it, under
  // the vault row lock (ABORTED otherwise): every epoch-0 revision has a seq
  // at most this, and readers take that bound from the verified members
  // entry only, refusing an epoch-0 revision with a later seq and every
  // epoch-0 revision of a vault whose log has no members entry. After the switch a
  // plaintext commit gets FAILED_PRECONDITION with reason
  // ERROR_REASON_VAULT_ENCRYPTED.
  //
  // The log must name exactly the vault's members, with their roles and
  // their current keys as UserKeyService stores them: the genesis entry
  // (seq 1) is signed by the caller and names them as creator, and the
  // members entry (seq 2) lists every other member, none when the caller is
  // the vault's only member. Epoch 1's record names the log's last entry.
  //
  // Errors: FAILED_PRECONDITION with a ConversionRefused error detail when
  // a member has no user key (or one without a signing key) or the vault
  // has pending invitations, which have no keys to wrap to: the owner
  // revokes them, the members create their keys, then the owner retries;
  // FAILED_PRECONDITION without that detail for a vault that is already end-to-end
  // encrypted, and for escrow on a server without an escrow key; ABORTED when the
  // log does not name the vault's current members, roles and keys, or
  // path_keys do not name exactly the vault's live documents (they
  // changed meanwhile: list them again and retry); INVALID_ARGUMENT for
  // out-of-bounds fields, entries or a record that do not verify, slots
  // that are not the record's recipients, or two live documents with the
  // same path key. Nothing changes unless the conversion succeeds.
  rpc ConvertVault(ConvertVaultRequest) returns (ConvertVaultResponse) {}
}

// KeyRecipientKind is whom a key slot wraps an epoch key to.
enum KeyRecipientKind {
  // Not a valid recipient kind.
  KEY_RECIPIENT_KIND_UNSPECIFIED = 0;
  // A member's user key; recipient_id is the user id.
  KEY_RECIPIENT_KIND_USER = 1;
  // The deployment's escrow key (SPEC.md §9.4).
  KEY_RECIPIENT_KIND_ESCROW = 2;
  // A pending invitation's key (docs/design/crypto.md, "Invitation keys");
  // recipient_id is the invitation id. Its slots are stored with
  // CreateInvitation and read with MembershipService.GetInvitationSlots.
  KEY_RECIPIENT_KIND_INVITATION = 3;
}

// KeySlot is an epoch key wrapped to one recipient.
message KeySlot {
  // The epoch whose key is wrapped. Ignored in a NextEpoch, whose slots are
  // all for the new epoch.
  uint32 epoch = 1;
  // Whom the key is wrapped to. Must not be unspecified.
  KeyRecipientKind recipient_kind = 2;
  // For KEY_RECIPIENT_KIND_USER the user id, and for
  // KEY_RECIPIENT_KIND_INVITATION the invitation id, a canonical lowercase
  // UUID; for KEY_RECIPIENT_KIND_ESCROW an identifier of the escrow key, 1 to 255
  // printable ASCII bytes.
  string recipient_id = 3;
  // The wrapped epoch key (an age file, docs/design/crypto.md): 1 to 2048
  // bytes, opaque to the server.
  bytes wrapped_key = 4;
  // The user who stored the slot. Output only.
  string creator_user_id = 5;
  // When the slot was stored. Output only.
  google.protobuf.Timestamp create_time = 6;
}

// KeyEpoch is one key epoch of a vault.
message KeyEpoch {
  // The epoch number, from 1.
  uint32 epoch = 1;
  // The epoch's key commitment (32 bytes), which recipients check the
  // unwrapped key against.
  bytes commitment = 2;
  // The owner who created the epoch.
  string creator_user_id = 3;
  // When the epoch was created.
  google.protobuf.Timestamp create_time = 4;
  // The owner's signed epoch record (docs/design/crypto.md), as RotateEpoch
  // or RemoveMember stored it. Unset for an epoch created without one.
  EpochRecord record = 5;
  // Whether the epoch is retired (RetireEpoch): no revision uses it and it
  // has no key slots.
  bool retired = 6;
}

// EpochRecipient is one recipient of a signed epoch record.
message EpochRecipient {
  // The recipient kind byte: 1 (user), 2 (escrow) or 3 (invitation).
  uint32 kind = 1;
  // The encoded recipient id: the 16 bytes of the user or invitation id,
  // or the escrow key id.
  bytes recipient_id = 2;
  // SHA-256 of the recipient's public key as the membership log records it
  // (32 bytes).
  bytes key_hash = 3;
}

// EpochRecord is an owner's signature over a new epoch
// (docs/design/crypto.md, epoch_body). The vault, the epoch number, its
// commitment and the previous epoch's commitment are the epoch's own and
// are not repeated here.
message EpochRecord {
  // The membership log position the record names, from 1.
  uint64 log_seq = 1;
  // The hash of the log entry at log_seq (32 bytes).
  bytes log_hash = 2;
  // Every recipient of the epoch, sorted by kind, then recipient id: the
  // members at log_seq, the pending invitations and the escrow key if
  // escrow is on.
  repeated EpochRecipient recipients = 3;
  // The Ed25519 signature of epoch_body by an owner at log_seq (64 bytes).
  bytes signature = 4;
}

// NextEpoch is the epoch that replaces the vault's current one.
message NextEpoch {
  // The vault's current epoch as the caller knows it (0 before the first
  // epoch). The new epoch is expected_epoch + 1.
  uint32 expected_epoch = 1;
  // The new epoch's key commitment: exactly 32 bytes.
  bytes commitment = 2;
  // The new epoch key wrapped to each of its recipients: at most 101 slots
  // (one per member, plus one escrow slot), one per recipient.
  repeated KeySlot slots = 3;
}

// MissingSlot is a member's missing key slot for one epoch.
message MissingSlot {
  // The epoch.
  uint32 epoch = 1;
  // The member's user id.
  string user_id = 2;
  // The member's hybrid ML-KEM-768 + X25519 user public key (1216 bytes)
  // to wrap the epoch key to.
  bytes public_key = 3;
}

// ListKeySlotsRequest pages through the caller's slots.
message ListKeySlotsRequest {
  // The vault. The caller must be a member.
  string vault_id = 1;
  // Maximum number of slots to return. Zero selects the server default
  // (100); larger values are capped at 1000.
  uint32 page_size = 2;
  // Opaque token from a previous response. Empty for the first page.
  string page_token = 3;
  // Whose slots to list: unspecified or KEY_RECIPIENT_KIND_USER for the
  // caller's own; KEY_RECIPIENT_KIND_ESCROW for the vault's escrow slots,
  // open to editors and owners only. An escrow slot opens only with the
  // escrow identity.
  KeyRecipientKind recipient_kind = 4;
}

// ListKeySlotsResponse is one page of the requested slots.
message ListKeySlotsResponse {
  // The requested slots, in ascending epoch order.
  repeated KeySlot slots = 1;
  // Token for the next page; empty when there are no more.
  string next_page_token = 2;
}

// ListEpochsRequest pages through the vault's epochs.
message ListEpochsRequest {
  // The vault. The caller must be a member.
  string vault_id = 1;
  // Maximum number of epochs to return. Zero selects the server default
  // (100); larger values are capped at 1000.
  uint32 page_size = 2;
  // Opaque token from a previous response. Empty for the first page.
  string page_token = 3;
}

// ListEpochsResponse is one page of the vault's epochs.
message ListEpochsResponse {
  // Epochs in ascending order.
  repeated KeyEpoch epochs = 1;
  // Token for the next page; empty when there are no more.
  string next_page_token = 2;
  // The epoch new revisions must use; 0 when the vault has none.
  uint32 current_epoch = 3;
  // Whether an owner client should create the next epoch (RotateEpoch):
  // set on a new E2EE vault and when a member leaves.
  bool rotation_pending = 4;
  // For a vault converted in place (ConvertVault), the vault's head_seq at
  // the conversion: only revisions with a seq at most this may be at epoch
  // 0, and they are plaintext. 0 for a vault that was never converted, or
  // was converted with no revisions; then no revision may be at epoch 0.
  // Informational: clients take this bound only from the signed members
  // entry of the verified log, never from this field.
  uint64 conversion_seq = 5;
}

// ListMissingSlotsRequest pages through the vault's missing slots.
message ListMissingSlotsRequest {
  // The vault. The caller must be an owner.
  string vault_id = 1;
  // Maximum number of entries to return. Zero selects the server default
  // (100); larger values are capped at 1000.
  uint32 page_size = 2;
  // Opaque token from a previous response. Empty for the first page.
  string page_token = 3;
}

// ListMissingSlotsResponse is one page of missing slots.
message ListMissingSlotsResponse {
  // Missing slots, ordered by epoch, then user id.
  repeated MissingSlot missing_slots = 1;
  // Token for the next page; empty when there are no more.
  string next_page_token = 2;
}

// RotateEpochRequest creates the vault's next epoch.
message RotateEpochRequest {
  // The vault. The caller must be an owner.
  string vault_id = 1;
  // The new epoch.
  NextEpoch next_epoch = 2;
  // The new epoch's signed record. Required for an E2EE vault: it must be
  // signed by an owner at its log position, and its recipients must be
  // exactly those the log names there and match next_epoch's slots.
  EpochRecord record = 3;
  // The owner's signed escrow on/off entry (type 8), to turn the vault's
  // escrow on or off with this rotation, or escrow reset entry (type 10),
  // to move an escrowed vault to the escrow chain's head. It is appended to
  // the membership log in the same transaction as the epoch, and the
  // record's log position must be this entry. An escrow "on" entry and an
  // escrow reset entry must name the chain's head, or the call fails with
  // ERROR_REASON_ESCROW_NOT_CURRENT.
  LogEntry escrow_entry = 4;
  // An escrow reset entry (type 10) of a vault with escrow off, appended
  // directly before escrow_entry, which must then be an escrow "on" entry
  // naming the same bundle. Both are appended with the epoch in one
  // transaction.
  LogEntry escrow_reset_entry = 5;
}

// RotateEpochResponse returns the new epoch.
message RotateEpochResponse {
  // The epoch created.
  KeyEpoch epoch = 1;
}

// AddKeySlotsRequest grants key slots.
message AddKeySlotsRequest {
  // The vault. The caller must be an owner.
  string vault_id = 1;
  // The slots to store: 1 to 1000, at most one per epoch and recipient.
  repeated KeySlot slots = 2;
}

// AddKeySlotsResponse counts the slots stored.
message AddKeySlotsResponse {
  // How many of the slots were stored; the others already existed.
  uint32 added = 1;
}

// ListLogEntriesRequest pages through the vault's membership log.
message ListLogEntriesRequest {
  // The vault. The caller must be a member or hold invitation_id.
  string vault_id = 1;
  // Maximum number of entries to return. Zero selects the server default
  // (100); larger values are capped at 1000.
  uint32 page_size = 2;
  // Opaque token from a previous response. Empty for the first page.
  string page_token = 3;
  // Optional. For a caller who is not a member: the `<id>` of the E2EE
  // invite code `<id>.<secret>` (22 characters of base64url without
  // padding) of a pending, unexpired invitation to vault_id. The server
  // matches SHA-256 of its 16 bytes against the invitation's id_hash.
  // Ignored for members.
  string invitation_id = 4;
}

// ListLogEntriesResponse is one page of the vault's membership log.
message ListLogEntriesResponse {
  // Entries in ascending seq order.
  repeated LogEntry entries = 1;
  // Token for the next page; empty when there are no more.
  string next_page_token = 2;
}

// ListStaleRevisionsRequest pages through the vault's revisions not on the
// current epoch.
message ListStaleRevisionsRequest {
  // The vault. The caller must be an owner.
  string vault_id = 1;
  // Maximum number of revisions to return. Zero selects the server default
  // (100); larger values are capped at 1000.
  uint32 page_size = 2;
  // Opaque token from a previous response. Empty for the first page.
  string page_token = 3;
}

// ListStaleRevisionsResponse is one page of revisions not on the current
// epoch.
message ListStaleRevisionsResponse {
  // Revisions in ascending seq order, each with its epoch, sealed path and
  // content reference as stored.
  repeated Revision revisions = 1;
  // Token for the next page; empty when there are no more.
  string next_page_token = 2;
  // The vault's current epoch when the page was read: the to_epoch for
  // ReplaceRevisionCiphertext. 0 for a plaintext vault.
  uint32 current_epoch = 3;
}

// ReplaceRevisionCiphertextRequest re-encrypts one stored revision.
message ReplaceRevisionCiphertextRequest {
  // The vault. The caller must be an owner.
  string vault_id = 1;
  // The revision, a canonical lowercase UUID.
  string revision_id = 2;
  // The epoch the revision must still be at, as the caller read it.
  uint32 from_epoch = 3;
  // The epoch the new ciphertext is sealed under, which must still be the
  // vault's current epoch. Greater than from_epoch.
  uint32 to_epoch = 4;
  // The revision's path sealed under to_epoch: 1 to MaxEncryptedPathBytes
  // bytes of ciphertext, as CommitRevisionRequest.path.
  bytes path = 5;
  // The revision's content sealed under to_epoch, a complete blob in the
  // vault with this size. Exactly when the revision has content (a folder
  // has none).
  ContentRef content_ref = 6;
}

// ReplaceRevisionCiphertextResponse says whether the rewrite was applied.
message ReplaceRevisionCiphertextResponse {
  // True when the revision now holds the new ciphertext; false when the
  // rewrite was skipped because the revision is no longer at from_epoch or
  // to_epoch is no longer current.
  bool replaced = 1;
}

// RetireEpochRequest retires one epoch of the vault.
message RetireEpochRequest {
  // The vault. The caller must be an owner.
  string vault_id = 1;
  // The epoch to retire: 2 or more, below the current epoch.
  uint32 epoch = 2;
}

// RetireEpochResponse is empty.
message RetireEpochResponse {}

// DocumentPathKey is the end-to-end encrypted path key of one live document.
message DocumentPathKey {
  // The document, a canonical lowercase UUID.
  string document_id = 1;
  // HMAC-SHA256(path_key_secret, normalize(path)) of the document's current
  // path, with path_key_secret derived from epoch 1's key
  // (docs/design/crypto.md): exactly 32 bytes.
  bytes path_key = 2;
}

// ConvertVaultRequest converts a plaintext vault to end-to-end encryption.
message ConvertVaultRequest {
  // The vault. The caller must be an owner.
  string vault_id = 1;
  // The genesis entry of the vault's membership log (seq 1), signed by the
  // caller, naming the caller as creator and recording the escrow key
  // exactly when escrow is set.
  LogEntry genesis = 2;
  // The members entry (seq 2, type 9), signed by the caller: the vault's
  // head_seq it was read at (converted_at_seq) and every other member with
  // their role and keys, none when the caller is the vault's only member.
  // Required.
  LogEntry members_entry = 3;
  // Epoch 1: expected_epoch 0, its commitment and a slot for every member
  // (and the escrow key with escrow).
  NextEpoch next_epoch = 4;
  // Epoch 1's signed record, naming the log's last entry.
  EpochRecord record = 5;
  // Whether the converted vault has escrow (SPEC.md §9.4).
  bool escrow = 6;
  // The path key of every live (not deleted) document of the vault, one
  // per document.
  repeated DocumentPathKey path_keys = 7;
}

// ConvertVaultResponse returns the vault's first epoch.
message ConvertVaultResponse {
  // Epoch 1.
  KeyEpoch epoch = 1;
  // The vault's head_seq at the conversion (ListEpochsResponse.conversion_seq).
  uint64 conversion_seq = 2;
}

// ConversionRefused is attached to ConvertVault's FAILED_PRECONDITION
// error when the vault cannot be converted yet. It lists what blocks it.
message ConversionRefused {
  // The members without a user key, or with one that has no signing key,
  // as canonical lowercase UUIDs, sorted.
  repeated string members_without_key = 1;
  // The vault's pending invitations, as canonical lowercase UUIDs, sorted.
  repeated string pending_invitations = 2;
}
