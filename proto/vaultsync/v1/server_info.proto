syntax = "proto3";

package vaultsync.v1;

option go_package = "github.com/solidDoWant/vault-sync/gen/vaultsync/v1;vaultsyncv1";

// ServerInfoService exposes server metadata. It is the only unauthenticated
// service: clients call it before signing in to check that they speak a
// compatible protocol version and to discover the identity provider to sign
// in with.
service ServerInfoService {
  // GetServerInfo returns the server build version, the protocol version,
  // limits clients need, and OIDC discovery data. It requires no
  // authentication and reveals nothing about vaults or users, and nothing
  // secret: the issuer and the public client id are public by design.
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse) {}
}

// GetServerInfoRequest has no parameters.
message GetServerInfoRequest {}

// GetServerInfoResponse describes the server.
message GetServerInfoResponse {
  // Server build version.
  string version = 1;
  // Highest protocol version the server speaks. The vaultsync.v1 schema is
  // protocol version 1.
  uint32 protocol_version = 2;
  // Maximum number of vaults one realtime WebSocket connection may
  // subscribe to (SPEC.md §6.4). Zero means the server does not offer the
  // realtime channel.
  uint32 max_realtime_subscriptions = 3;
  // The OIDC issuer identifier whose access tokens the server accepts
  // (VAULT_SYNC_OIDC_ISSUER_URL), exactly as configured, including any
  // trailing slash (SPEC.md §9.1). Clients discover the identity provider's
  // endpoints from `<issuer>/.well-known/openid-configuration`. Empty from
  // servers older than this field.
  string oidc_issuer_url = 4;
  // The public OAuth client id the plugin signs in as with the device
  // authorization grant (VAULT_SYNC_OIDC_CLIENT_ID, by default the
  // audience). A public client has no secret. Empty when the server
  // advertises none; the user then enters it.
  string oidc_client_id = 5;
  // The deployment's escrow public key (SPEC.md §9.4): the 1216-byte
  // hybrid ML-KEM-768 + X25519 public key that clients wrap every epoch key
  // of an escrow vault to (VAULT_SYNC_ESCROW_RECIPIENT). Empty when the
  // server has no escrow key; escrow vaults cannot be created then.
  bytes escrow_public_key = 6;
  // The id that names escrow_public_key in escrow key slots (their
  // recipient_id): "sha256:" and the lowercase hex SHA-256 of the key.
  // Empty when the server has no escrow key.
  string escrow_key_id = 7;
  // Whether a new end-to-end encrypted vault has escrow unless its owner
  // turns it off (VAULT_SYNC_ESCROW_DEFAULT, on by default). Always false
  // when the server has no escrow key.
  bool escrow_default = 8;
}
