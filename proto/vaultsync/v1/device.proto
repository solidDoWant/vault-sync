syntax = "proto3";

package vaultsync.v1;

import "vaultsync/v1/types.proto";

option go_package = "github.com/solidDoWant/vault-sync/gen/vaultsync/v1;vaultsyncv1";

// DeviceService manages the calling user's devices (plugin installations).
service DeviceService {
  // RegisterDevice registers a new device for the caller. Each plugin
  // installation registers once and sends the returned id with every commit.
  //
  // Errors: INVALID_ARGUMENT for an empty or over-long name, a name containing
  // a control character (such as U+0000), or a public key
  // that is neither empty nor 32 bytes, or a registration_id that is
  // neither empty nor a canonical lowercase UUID; RESOURCE_EXHAUSTED, with
  // an ErrorDetail of reason ERROR_REASON_DEVICE_LIMIT, when the caller has
  // reached the server's device limit; ALREADY_EXISTS when registration_id
  // names a device of the caller's, not removed, whose name or public key
  // differ from the request's.
  //
  // A call with a registration_id is idempotent: a retry with the same
  // registration_id, name and public key returns the device the first call
  // registered (if it is not removed) and uses no further place under the
  // device limit, so a client that lost the response, or crashed before
  // saving it, can retry safely.
  //
  // The limit counts the caller's devices that have not been removed
  // (RemoveDevice), so removing a device frees a place for a new one.
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse) {}

  // ListDevices returns the caller's devices that have not been removed,
  // oldest first. It returns no other user's devices and nothing secret
  // (no public key). The list is not paginated: it is bounded by the
  // server's device limit.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse) {}

  // RemoveDevice removes one of the caller's devices. A removed device no
  // longer counts toward the device limit and can no longer commit
  // (CommitRevision returns NOT_FOUND for it, as for an unknown device);
  // the revisions it committed keep their history and attribution, and its
  // name is still shown with them (GetDocumentHistoryResponse.device_names). The
  // removal takes effect on every server replica once the call returns: a
  // commit from the device that is in flight finishes first, and no later
  // commit is accepted. Removal cannot be undone; the installation
  // registers again to sync.
  //
  // Errors: INVALID_ARGUMENT when device_id is not a canonical lowercase
  // UUID; NOT_FOUND when the caller has no such device, including a device
  // of another user and one that is already removed.
  rpc RemoveDevice(RemoveDeviceRequest) returns (RemoveDeviceResponse) {}

  // RenameDevice renames one of the caller's devices that is not removed.
  // The device keeps its id; ListDevices and the history of the revisions it
  // committed (GetDocumentHistoryResponse.device_names) show the new name.
  //
  // Errors: INVALID_ARGUMENT when device_id is not a canonical lowercase
  // UUID, or for a name that RegisterDevice would refuse (blank, over 256
  // bytes, or containing a Cc, Cf, Zl or Zp character); NOT_FOUND when the
  // caller has no such device, including a device of another user and one
  // that is removed.
  rpc RenameDevice(RenameDeviceRequest) returns (RenameDeviceResponse) {}
}

// RegisterDeviceRequest describes the device to register.
message RegisterDeviceRequest {
  // Human-readable device name. Must be non-blank, at most 256 bytes, and
  // free of control characters (Unicode category Cc), format characters (Cf,
  // such as bidi controls and zero-width characters) and line or paragraph
  // separators (Zl, Zp).
  string name = 1;
  // The device's X25519 public key (SPEC.md §5): exactly 32 bytes, or empty
  // for a device registered without one.
  bytes public_key = 2;
  // Client-chosen idempotency key: empty, or a canonical lowercase UUID the
  // client stores before its first attempt and sends with every retry of
  // the same registration. Empty registers a new device on every call.
  string registration_id = 3;
}

// RegisterDeviceResponse returns the registered device.
message RegisterDeviceResponse {
  // The new device.
  Device device = 1;
}

// ListDevicesRequest lists the caller's devices. It has no fields.
message ListDevicesRequest {}

// ListDevicesResponse holds the caller's devices that have not been removed.
message ListDevicesResponse {
  // The caller's devices, oldest first.
  repeated Device devices = 1;
}

// RemoveDeviceRequest names the device to remove.
message RemoveDeviceRequest {
  // Id of one of the caller's devices (Device.id), a canonical lowercase
  // UUID.
  string device_id = 1;
}

// RemoveDeviceResponse confirms the removal. It has no fields.
message RemoveDeviceResponse {}

// RenameDeviceRequest names the device to rename and its new name.
message RenameDeviceRequest {
  // Id of one of the caller's devices (Device.id), a canonical lowercase
  // UUID.
  string device_id = 1;
  // The new name, under the same rules as RegisterDeviceRequest.name.
  string name = 2;
}

// RenameDeviceResponse returns the renamed device.
message RenameDeviceResponse {
  // The device, with its new name.
  Device device = 1;
}
