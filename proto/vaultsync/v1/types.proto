syntax = "proto3";

package vaultsync.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/solidDoWant/vault-sync/gen/vaultsync/v1;vaultsyncv1";

// Conventions shared by every vaultsync.v1 message (SPEC.md §5):
//
// - Identifiers are UUIDv7 strings in canonical lowercase hyphenated form.
// - Every vault-scoped request carries a vault_id. The server resolves the
//   caller's role in that vault before touching any data. A caller who is not
//   a member gets NOT_FOUND, exactly as if the vault did not exist.
// - Fields that hold content, paths, or values derived from them are bytes, so
//   that end-to-end encrypted vaults (SPEC.md §9.3) carry ciphertext or HMACs
//   in the same fields that plaintext vaults use for plaintext.
// - Every input is bounded by server configuration (sizes, lengths, page
//   sizes); exceeding a bound is INVALID_ARGUMENT.

// DocumentKind selects how clients merge concurrent edits to a document
// (SPEC.md §7). The server never merges content; it only stores the kind.
enum DocumentKind {
  // Not set. Never valid on a stored document.
  DOCUMENT_KIND_UNSPECIFIED = 0;
  // Opaque bytes: remote wins in place, local becomes a conflict copy.
  DOCUMENT_KIND_BLOB = 1;
  // UTF-8 text: three-way merge on the client.
  DOCUMENT_KIND_TEXT = 2;
  // Yjs CRDT document (Phase 5, SPEC.md §10). Rejected with INVALID_ARGUMENT
  // until live editing is implemented.
  DOCUMENT_KIND_YJS = 3;
}

// VaultEncryption is a vault's encryption mode, fixed at creation.
enum VaultEncryption {
  // Not set. Never valid on a stored vault.
  VAULT_ENCRYPTION_UNSPECIFIED = 0;
  // Content and paths are stored in plaintext.
  VAULT_ENCRYPTION_NONE = 1;
  // Content and paths are end-to-end encrypted (SPEC.md §9.3).
  VAULT_ENCRYPTION_E2EE = 2;
}

// VaultRole is a member's role in a vault (SPEC.md §9.2).
enum VaultRole {
  // Not set. Never valid on a stored membership.
  VAULT_ROLE_UNSPECIFIED = 0;
  // Can read, write, and manage members and vault settings.
  VAULT_ROLE_OWNER = 1;
  // Can read and write.
  VAULT_ROLE_EDITOR = 2;
  // Can only read. Write RPCs return PERMISSION_DENIED.
  VAULT_ROLE_VIEWER = 3;
}

// Vault is a synchronized Obsidian vault as visible to the caller.
message Vault {
  // Vault id (UUIDv7).
  string id = 1;
  // Human-readable vault name.
  string name = 2;
  // Encryption mode, fixed at creation.
  VaultEncryption encryption = 3;
  // Whether each epoch key is also wrapped to the deployment's escrow key so
  // the export job can write plaintext backups (SPEC.md §9.4). Always false
  // for VAULT_ENCRYPTION_NONE. Fixed at creation.
  bool escrow = 4;
  // The vault-wide change counter: the seq of the most recent revision.
  // Zero for a vault with no revisions.
  uint64 head_seq = 5;
  // The caller's role in this vault.
  VaultRole role = 6;
  // When the vault was created.
  google.protobuf.Timestamp create_time = 7;
}

// Device is one plugin installation belonging to the calling user.
message Device {
  // Device id (UUIDv7).
  string id = 1;
  // Human-readable device name, for example "Laptop".
  string name = 2;
  // When the device was registered.
  google.protobuf.Timestamp create_time = 3;
  // When the device last committed a revision, to within a minute; unset if
  // it never has. Only ListDevices sets it.
  google.protobuf.Timestamp last_activity_time = 4;
}

// ContentRef points at the content of a revision: a complete blob in the same
// vault (SPEC.md §5 "Content addressing").
message ContentRef {
  // Content address. For plaintext vaults SHA-256(content) (32 bytes). For
  // E2EE vaults HMAC-SHA256(blob_id_secret, plaintext) (32 bytes); the blob
  // itself then holds ciphertext.
  bytes blob_id = 1;
  // Size in bytes of the stored blob (ciphertext size for E2EE vaults).
  uint64 size = 2;
}

// Document is a file with a stable identity across renames.
message Document {
  // Document id (UUIDv7), generated by the client that created it.
  string id = 1;
  // Vault the document belongs to.
  string vault_id = 2;
  // Merge behavior for this document.
  DocumentKind kind = 3;
  // Id of the document's current head revision.
  string head_rev_id = 4;
}

// Revision is one entry in a document's history. Revisions are append-only;
// a create, rename, edit, delete, or restore each adds one. Retention may
// purge old revisions other than the head (SPEC.md §11); parent_rev_id is
// the only field that changes afterwards.
message Revision {
  // Revision id (UUIDv7), generated by the committing client.
  string id = 1;
  // Document this revision belongs to.
  string document_id = 2;
  // Vault this revision belongs to.
  string vault_id = 3;
  // Position in the vault-wide change order, assigned by the server on
  // commit. Strictly increasing within a vault.
  uint64 seq = 4;
  // Id of the revision this one was based on or, once retention purged that
  // revision, of the nearest older revision that is retained (SPEC.md §11):
  // it always names a revision that exists. Empty for the document's first
  // revision, and once every older revision was purged.
  string parent_rev_id = 5;
  // Kind of the document at this revision.
  DocumentKind kind = 6;
  // Content of the document at this revision. For tombstones (deleted = true)
  // this is the content at the time of deletion, kept reachable in history.
  ContentRef content_ref = 7;
  // Vault-relative path using "/" separators. UTF-8 bytes for plaintext
  // vaults; suite-versioned ciphertext for E2EE vaults (SPEC.md §9.3).
  bytes path = 8;
  // Whether this revision is a tombstone (the document is deleted).
  bool deleted = 9;
  // Device that committed this revision.
  string device_id = 10;
  // User that committed this revision.
  string user_id = 11;
  // When the server accepted this revision.
  google.protobuf.Timestamp create_time = 12;
  // Random value the server assigned when it stored this revision (16
  // bytes). Unlike id, which the committing client chooses, it cannot be
  // reproduced by a server restored from a backup that commits again: a
  // client sends the anchor of the revision at its cursor as
  // ListChangesRequest.since_anchor, and that of its own latest commit above
  // the cursor as own_commit_anchor, to detect such a restore (SPEC.md §6.1).
  bytes anchor = 13;
}
