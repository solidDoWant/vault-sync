syntax = "proto3";

package vaultsync.v1;

option go_package = "github.com/solidDoWant/vault-sync/gen/vaultsync/v1;vaultsyncv1";

// UserKeyService stores the calling user's end-to-end encryption key pair
// (SPEC.md §9.3). The private key is stored only wrapped under a key the
// user's device derives from the recovery passphrase with Argon2id. From the
// same Argon2id output the device derives auth_key, which the server checks
// before it releases the wrapped key: the server stores only SHA-256 of
// auth_key and compares in constant time.
//
// Every procedure acts on the caller's own key only; none can name another
// user's key. A user has at most one key, which is never replaced (only
// re-wrapped by ChangePassphrase).
//
// Failed attempts: UnlockUserKey and ChangePassphrase calls with a wrong
// auth_key are counted per user, on every server replica alike. After 10 of
// them within one hour (the hour starting at the first counted failure),
// every UnlockUserKey and ChangePassphrase call gets RESOURCE_EXHAUSTED, with
// an ErrorDetail of reason ERROR_REASON_PASSPHRASE_ATTEMPTS_EXHAUSTED and
// retry_time set to the end of the hour, even with the right auth_key. Calls
// refused that way are not counted. A successful call does not reset the
// count.
service UserKeyService {
  // GetUserKeyParams returns the caller's public key and the parameters a
  // device needs to derive auth_key and the wrapping key from the
  // passphrase. It releases no key material.
  //
  // Errors: NOT_FOUND when the caller has no key.
  rpc GetUserKeyParams(GetUserKeyParamsRequest) returns (GetUserKeyParamsResponse) {}

  // CreateUserKey stores the caller's key pair. It is create-only, so two
  // devices enabling encryption at once cannot replace each other's key.
  //
  // Errors: INVALID_ARGUMENT for any field out of its bounds (checked before
  // anything is stored); ALREADY_EXISTS when the caller already has a key,
  // which is left unchanged.
  rpc CreateUserKey(CreateUserKeyRequest) returns (CreateUserKeyResponse) {}

  // UnlockUserKey returns the caller's wrapped private key when auth_key is
  // right.
  //
  // Errors: INVALID_ARGUMENT when auth_key is not 32 bytes; NOT_FOUND when
  // the caller has no key; PERMISSION_DENIED, with an ErrorDetail of reason
  // ERROR_REASON_WRONG_PASSPHRASE, when auth_key is wrong (counted as a
  // failed attempt); RESOURCE_EXHAUSTED when too many attempts failed (see
  // the service comment).
  rpc UnlockUserKey(UnlockUserKeyRequest) returns (UnlockUserKeyResponse) {}

  // ChangePassphrase replaces the wrapped private key, its parameters and
  // the verifier in one step: a compare-and-swap on the stored public key,
  // which the new wrapping must keep. The key pair itself never changes.
  //
  // Errors: INVALID_ARGUMENT for any field out of its bounds; NOT_FOUND when
  // the caller has no key; PERMISSION_DENIED with reason
  // ERROR_REASON_WRONG_PASSPHRASE when auth_key is wrong (counted as a failed
  // attempt); FAILED_PRECONDITION when public_key is not the stored public
  // key (nothing changes); RESOURCE_EXHAUSTED when too many attempts failed.
  rpc ChangePassphrase(ChangePassphraseRequest) returns (ChangePassphraseResponse) {}

  // GetAnchorList returns the caller's sealed anchor list
  // (docs/design/encryption.md, "Trust anchors") and its version. A caller
  // who has never stored one gets version 0 and an empty list. The server
  // never opens the list.
  rpc GetAnchorList(GetAnchorListRequest) returns (GetAnchorListResponse) {}

  // PutAnchorList replaces the caller's sealed anchor list. It is a
  // compare-and-set on the version: the list is stored only when version is
  // the stored version plus one (1 for a caller without a list), so of
  // concurrent writers of the same version exactly one succeeds.
  //
  // Errors: INVALID_ARGUMENT when version is 0 or above 2^63 - 1, or
  // sealed_list is empty or longer than 4800045 bytes (checked before
  // anything is stored); FAILED_PRECONDITION when version is not the stored
  // version plus one (nothing changes: read the list again and merge).
  rpc PutAnchorList(PutAnchorListRequest) returns (PutAnchorListResponse) {}
}

// PassphraseParams are the public parameters of a passphrase wrapping
// (docs/design/crypto.md), which a device needs before it can derive
// anything from the passphrase.
message PassphraseParams {
  // The crypto suite of the wrapping. Only 2 is accepted.
  uint32 suite = 1;
  // Argon2id memory in KiB: 19456 to 131072.
  uint32 memory_kib = 2;
  // Argon2id passes: 2 to 8.
  uint32 iterations = 3;
  // Argon2id lanes: 1 to 4.
  uint32 parallelism = 4;
  // Argon2id salt: exactly 16 bytes.
  bytes salt = 5;
}

// GetUserKeyParamsRequest has no fields: it names the caller's key.
message GetUserKeyParamsRequest {}

// GetUserKeyParamsResponse holds the caller's public key and wrapping
// parameters.
message GetUserKeyParamsResponse {
  // The caller's public key: a hybrid ML-KEM-768 + X25519 key (1216 bytes)
  // for suite 2, an X25519 key (32 bytes) for a key stored under suite 1.
  bytes public_key = 1;
  // The parameters of the current wrapping.
  PassphraseParams params = 2;
  // The caller's server user id (Member.user_id), a canonical lowercase
  // UUID: the id a signed log entry must name for the caller. The token's
  // subject is the OIDC subject, not this id.
  string user_id = 3;
}

// CreateUserKeyRequest holds a new key pair, its private key wrapped.
message CreateUserKeyRequest {
  // The hybrid ML-KEM-768 + X25519 public key: exactly 1216 bytes.
  bytes public_key = 1;
  // The private key wrapped under the passphrase: 1 to 256 bytes, opaque to
  // the server.
  bytes wrapped_private_key = 2;
  // The parameters of the wrapping.
  PassphraseParams params = 3;
  // The verifier derived from the passphrase: exactly 32 bytes. The server
  // stores only its SHA-256.
  bytes auth_key = 4;
}

// CreateUserKeyResponse confirms the key was stored.
message CreateUserKeyResponse {
  // The caller's user id, as in GetUserKeyParamsResponse.
  string user_id = 1;
}

// UnlockUserKeyRequest presents the verifier.
message UnlockUserKeyRequest {
  // The verifier derived from the passphrase: exactly 32 bytes.
  bytes auth_key = 1;
}

// UnlockUserKeyResponse releases the caller's wrapped key.
message UnlockUserKeyResponse {
  // The caller's public key, as in GetUserKeyParamsResponse.
  bytes public_key = 1;
  // The private key wrapped under the passphrase.
  bytes wrapped_private_key = 2;
  // The parameters of the wrapping.
  PassphraseParams params = 3;
  // The caller's user id, as in GetUserKeyParamsResponse.
  string user_id = 4;
}

// ChangePassphraseRequest re-wraps the caller's private key.
message ChangePassphraseRequest {
  // The verifier derived from the current passphrase: exactly 32 bytes.
  bytes auth_key = 1;
  // The public key the caller expects to be stored: exactly 32 bytes.
  bytes public_key = 2;
  // The same private key wrapped under the new passphrase: 1 to 256 bytes.
  bytes new_wrapped_private_key = 3;
  // The parameters of the new wrapping.
  PassphraseParams new_params = 4;
  // The verifier derived from the new passphrase: exactly 32 bytes.
  bytes new_auth_key = 5;
}

// ChangePassphraseResponse confirms the change. It has no fields.
message ChangePassphraseResponse {}

// GetAnchorListRequest has no fields: it names the caller's list.
message GetAnchorListRequest {}

// GetAnchorListResponse holds the caller's sealed anchor list.
message GetAnchorListResponse {
  // The version of the stored list; 0 when the caller has none.
  uint64 version = 1;
  // The anchor list sealed at version (docs/design/crypto.md, anchor_list),
  // opaque to the server; empty when version is 0.
  bytes sealed_list = 2;
}

// PutAnchorListRequest holds a new version of the caller's anchor list.
message PutAnchorListRequest {
  // The new version: the stored version plus one, 1 to 2^63 - 1.
  uint64 version = 1;
  // The anchor list sealed at version: 1 to 4800045 bytes (the sealed size
  // of 100000 anchors), opaque to the server.
  bytes sealed_list = 2;
}

// PutAnchorListResponse confirms the list was stored. It has no fields.
message PutAnchorListResponse {}
