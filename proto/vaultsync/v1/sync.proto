syntax = "proto3";

package vaultsync.v1;

import "vaultsync/v1/types.proto";

option go_package = "github.com/solidDoWant/vault-sync/gen/vaultsync/v1;vaultsyncv1";

// SyncService pulls and pushes document revisions (SPEC.md §6).
//
// Every RPC resolves the caller's role in vault_id first: a non-member gets
// NOT_FOUND (existence is never leaked); a viewer calling a write RPC gets
// PERMISSION_DENIED.
service SyncService {
  // ListChanges returns revisions with seq > since_seq in ascending seq order
  // (SPEC.md §6.1). Clients page by passing the seq of the last revision
  // received as the next since_seq until has_more is false, with that
  // revision's anchor as since_anchor.
  //
  // Revisions purged by retention (SPEC.md §11) are skipped, so seq values may
  // have gaps; a document's head revision is never purged.
  //
  // Errors: NOT_FOUND if the vault does not exist or the caller is not a
  // member. INVALID_ARGUMENT if since_anchor, own_commit_seq or
  // own_commit_anchor is malformed.
  rpc ListChanges(ListChangesRequest) returns (ListChangesResponse) {}

  // GetRevision fetches a single revision, including its content reference.
  // Clients use it to fetch the base of a three-way merge (SPEC.md §8).
  //
  // Errors: NOT_FOUND if the vault or revision does not exist (or was purged
  // by retention), or the caller is not a member.
  rpc GetRevision(GetRevisionRequest) returns (GetRevisionResponse) {}

  // CommitRevision appends a revision to a document with optimistic
  // concurrency (SPEC.md §6.2). The server accepts it only if base_rev_id is
  // the document's current head, or the document does not exist yet and
  // base_rev_id is empty. On success it assigns seq, advances the vault's
  // head_seq, and broadcasts vault_changed on the realtime channel. A
  // revision is acknowledged only when this RPC returns success.
  //
  // Commits are idempotent by revision_id: retrying a commit whose response
  // was lost with identical fields returns the already-committed revision,
  // even if the document's head has moved since.
  //
  // Errors:
  // - FAILED_PRECONDITION: base_rev_id is not the current head (the head
  //   moved; pull, merge, and retry); the error then carries the document,
  //   with its current head_rev_id, as a Document error detail. Also when
  //   base_rev_id is set but the document does not exist in the vault, when
  //   content_ref names a blob that is not complete in this vault, and for
  //   end-to-end encrypted vaults until they are supported.
  // - ALREADY_EXISTS: path_key collides with another live document in the
  //   vault, or the path names the folder of another live document's path,
  //   or lies under a folder another live document's path names as a file
  //   (SPEC.md §5, §6.3).
  // - INVALID_ARGUMENT: malformed or out-of-bounds fields, kind mismatch,
  //   content_ref.size differing from the stored blob's size, document_id or
  //   revision_id already in use outside this vault, or revision_id reused
  //   with different fields.
  // - PERMISSION_DENIED: the caller is a viewer.
  // - NOT_FOUND: the vault does not exist, the caller is not a member, or
  //   device_id is not one of the caller's devices.
  rpc CommitRevision(CommitRevisionRequest) returns (CommitRevisionResponse) {}

  // GetDocumentHistory lists a document's retained revisions, newest first
  // (SPEC.md §11). The head is always retained, including a tombstone, so a
  // deleted document's history is never empty. Restoring a revision is a
  // new CommitRevision with the revision's content_ref (and deleted false),
  // based on the current head. The response names the devices that
  // committed the page's revisions; device names are visible to every member
  // of the vault.
  //
  // Errors: NOT_FOUND if the vault or document does not exist, or the caller
  // is not a member.
  rpc GetDocumentHistory(GetDocumentHistoryRequest) returns (GetDocumentHistoryResponse) {}
}

// ListChangesRequest asks for revisions after a vault-wide cursor.
message ListChangesRequest {
  // Vault to read.
  string vault_id = 1;
  // Exclusive lower bound: only revisions with seq > since_seq are returned.
  // Zero returns the vault from the beginning.
  uint64 since_seq = 2;
  // Maximum number of revisions to return. Zero selects the server default;
  // the server caps larger values. The server may return fewer, with
  // has_more set, to keep the response within its size limit, but always at
  // least one if any exist.
  uint32 page_size = 3;
  // Anchor of the revision at since_seq, as the client received it
  // (Revision.anchor), or empty for no check. With an anchor, the server
  // first checks that the vault still holds that revision at since_seq, or
  // a purge marker of it if retention purged it (SPEC.md §11); if not, its
  // history no longer contains the client's cursor (it was restored from a
  // backup) and the response only sets diverged (SPEC.md §6.1, §8). Either
  // empty or exactly 16 bytes, and empty when since_seq is zero.
  bytes since_anchor = 4;
  // Seq of the client's own latest acknowledged commit above since_seq,
  // which the cursor does not cover yet (SPEC.md §6.1), or zero for none.
  // Given together with own_commit_anchor, and then above since_seq.
  uint64 own_commit_seq = 5;
  // Anchor of the revision at own_commit_seq (Revision.anchor), checked like
  // since_anchor in the same snapshot: unless the vault holds that revision
  // or its purge marker, the response only sets diverged. Either empty or
  // exactly 16 bytes; empty if and only if own_commit_seq is zero.
  bytes own_commit_anchor = 6;
}

// ListChangesResponse is one page of revisions.
message ListChangesResponse {
  // Revisions in strictly ascending seq order.
  repeated Revision revisions = 1;
  // Whether revisions with a higher seq than the last one returned exist.
  bool has_more = 2;
  // The vault's head_seq when the page was read.
  uint64 head_seq = 3;
  // Whether since_anchor or own_commit_anchor was given and the vault holds
  // neither a revision nor a purge marker with that anchor at its seq: the
  // database was restored to before it. The page is then empty and has_more
  // false; the client resyncs from seq zero (SPEC.md §8). Never set without
  // an anchor. A server from before purge markers also sets it when
  // retention purged the revision.
  bool diverged = 4;
}

// GetRevisionRequest identifies a revision.
message GetRevisionRequest {
  // Vault the revision belongs to.
  string vault_id = 1;
  // Revision to fetch.
  string revision_id = 2;
}

// GetRevisionResponse returns the revision.
message GetRevisionResponse {
  // The revision, including its content reference.
  Revision revision = 1;
}

// CommitRevisionRequest is a new revision for a (possibly new) document.
message CommitRevisionRequest {
  // Vault to write.
  string vault_id = 1;
  // Document to append to. For a new document the client generates a fresh
  // UUIDv7.
  string document_id = 2;
  // Id for the new revision, a client-generated UUIDv7. Makes the commit
  // idempotent across retries.
  string revision_id = 3;
  // The head revision this commit is based on. Empty if and only if the
  // document is new.
  string base_rev_id = 4;
  // Document kind. Required for a new document; for an existing document it
  // must equal the document's kind (kind changes are not part of v1).
  DocumentKind kind = 5;
  // Content of the document at this revision. Must name a complete blob in
  // this vault (see BlobService). Required, including for tombstones, where
  // it is the content being deleted.
  ContentRef content_ref = 6;
  // Vault-relative path using "/" separators. UTF-8 bytes for plaintext
  // vaults; suite-versioned ciphertext for E2EE vaults. The server bounds its
  // length. A plaintext path must be valid UTF-8 without control characters,
  // and none of its "/"-separated segments may be empty, "." or "..".
  bytes path = 7;
  // Uniqueness key for path (SPEC.md §5 "Paths"). Must be empty for
  // plaintext vaults, where the server derives it from path (Unicode NFC,
  // then case-folded). Required for E2EE vaults:
  // HMAC-SHA256(path_key_secret, normalize(path)), 32 bytes.
  bytes path_key = 8;
  // Whether this revision deletes the document (a tombstone).
  bool deleted = 9;
  // The caller's device committing the revision (from RegisterDevice).
  string device_id = 10;
}

// CommitRevisionResponse returns the accepted revision.
message CommitRevisionResponse {
  // The committed revision, with its server-assigned seq.
  Revision revision = 1;
}

// GetDocumentHistoryRequest pages through a document's revisions.
message GetDocumentHistoryRequest {
  // Vault the document belongs to.
  string vault_id = 1;
  // Document whose history to list.
  string document_id = 2;
  // Maximum number of revisions to return. Zero selects the server default;
  // the server caps larger values. The server may return fewer, with a
  // next_page_token, to keep the response within its size limit, but always
  // at least one if any exist.
  uint32 page_size = 3;
  // Opaque token from a previous GetDocumentHistoryResponse. Empty for the
  // first page.
  string page_token = 4;
}

// GetDocumentHistoryResponse is one page of a document's history.
message GetDocumentHistoryResponse {
  // The document, including its kind and current head.
  Document document = 1;
  // Revisions, newest (highest seq) first.
  repeated Revision revisions = 2;
  // Token for the next (older) page. Empty when there are no more revisions.
  string next_page_token = 3;
  // The name of each device that committed one of revisions, once per
  // device, so a member sees which device made each revision (SPEC.md §11).
  // Only devices with a revision on this page are named.
  repeated DeviceName device_names = 4;
}

// DeviceName names a device that committed a revision in a vault.
message DeviceName {
  // Device id (UUIDv7), as in Revision.device_id.
  string device_id = 1;
  // The device's name, as registered (RegisterDeviceRequest.name).
  string name = 2;
}
