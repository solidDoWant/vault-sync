syntax = "proto3";

package vaultsync.v1;

import "vaultsync/v1/types.proto";

option go_package = "github.com/solidDoWant/vault-sync/gen/vaultsync/v1;vaultsyncv1";

// VaultService creates and lists vaults. Membership and invitation management
// (Phase 3) and key management (Phase 4) are added as separate services.
service VaultService {
  // CreateVault creates a vault owned by the caller.
  //
  // Errors: INVALID_ARGUMENT for an empty or over-long name, a name containing
  // a control character (such as U+0000), an unspecified encryption mode, or
  // escrow requested for a plaintext vault; FAILED_PRECONDITION for escrow
  // on a server without an escrow key (GetServerInfo's escrow_public_key
  // is empty).
  //
  // A new VAULT_ENCRYPTION_E2EE vault has no key epoch and a pending
  // rotation: the owner's client creates epoch 1 with VaultKeyService's
  // RotateEpoch, wrapping its key to the owner and, with escrow, to the
  // escrow public key.
  rpc CreateVault(CreateVaultRequest) returns (CreateVaultResponse) {}

  // ListVaults lists the vaults the caller is a member of.
  rpc ListVaults(ListVaultsRequest) returns (ListVaultsResponse) {}

  // DeleteVault marks a vault deleted. Owner only. From then on every
  // member's requests naming the vault are NOT_FOUND with an ErrorDetail of
  // reason ERROR_REASON_VAULT_DELETED, ListVaults no longer lists it, and it
  // no longer counts toward its owners' vault limit.
  //
  // Errors: NOT_FOUND for a non-member or a vault that does not exist (with
  // ERROR_REASON_VAULT_DELETED for a member of an already deleted vault);
  // PERMISSION_DENIED for an editor or viewer.
  rpc DeleteVault(DeleteVaultRequest) returns (DeleteVaultResponse) {}
}

// CreateVaultRequest describes the vault to create.
message CreateVaultRequest {
  // Human-readable name. Must be non-blank, at most 256 bytes, and free of
  // control characters (Unicode category Cc), format characters (Cf, such as
  // bidi controls and zero-width characters) and line or paragraph
  // separators (Zl, Zp).
  string name = 1;
  // Encryption mode. Cannot be changed later.
  VaultEncryption encryption = 2;
  // Whether to enable escrow for plaintext backups (SPEC.md §9.4). Only valid
  // with VAULT_ENCRYPTION_E2EE. Cannot be changed later.
  bool escrow = 3;
}

// CreateVaultResponse returns the created vault.
message CreateVaultResponse {
  // The new vault. The caller is its owner.
  Vault vault = 1;
}

// ListVaultsRequest pages through the caller's vaults.
message ListVaultsRequest {
  // Maximum number of vaults to return. Zero selects the server default; the
  // server caps larger values.
  uint32 page_size = 1;
  // Opaque token from a previous ListVaultsResponse. Empty for the first page.
  string page_token = 2;
}

// ListVaultsResponse is one page of the caller's vaults.
message ListVaultsResponse {
  // Vaults the caller is a member of, each with the caller's role.
  repeated Vault vaults = 1;
  // Token for the next page. Empty when there are no more vaults.
  string next_page_token = 2;
}

// DeleteVaultRequest names the vault to delete.
message DeleteVaultRequest {
  // Vault to delete.
  string vault_id = 1;
}

// DeleteVaultResponse is empty.
message DeleteVaultResponse {}
