syntax = "proto3";

package vaultsync.v1;

import "google/protobuf/timestamp.proto";
import "vaultsync/v1/types.proto";
import "vaultsync/v1/vault_key.proto";

option go_package = "github.com/solidDoWant/vault-sync/gen/vaultsync/v1;vaultsyncv1";

// MembershipService manages who can access a vault (SPEC.md §9.2): owners
// invite users, change roles and remove members; invited users redeem their
// invitation; any member may leave.
//
// Every procedure that names a vault resolves the caller's role first. A
// caller who is not a member, and a vault that does not exist, get the same
// NOT_FOUND error. CreateInvitation, ListInvitations, RevokeInvitation,
// ListMembers, UpdateMemberRole and RemoveMember are owner-only: editors and
// viewers get PERMISSION_DENIED.
//
// A vault always has at least one owner: demoting or removing its last owner,
// and the last owner leaving, fail with FAILED_PRECONDITION.
//
// Membership changes take effect on the caller's next request, on every
// server replica, and end a removed member's open realtime subscriptions to
// the vault (with a NOT_FOUND error frame).
//
// In an end-to-end encrypted vault every change but ListInvitations and
// ListMembers carries its signed membership log entry (docs/design/crypto.md,
// "Identity keys, the membership log and signed epochs"). The server replays
// it onto the stored log (signatures, hash chain, the signer's right to sign),
// checks that it records exactly the requested change, and appends it in the
// same transaction as the change, under the vault row lock. A missing entry,
// an entry in a plaintext vault, or one that does not verify or does not match
// the request gets INVALID_ARGUMENT; an entry whose seq is not the log's next
// gets ABORTED, and the client retries on top of the new head
// (VaultKeyService.ListLogEntries). A refused change changes nothing.
service MembershipService {
  // CreateInvitation creates a single-use invitation to the vault and
  // returns its code. The code is returned only here: the server stores only
  // its hash. Anyone holding the code can redeem it until it expires, is
  // revoked or is used.
  //
  // In an end-to-end encrypted vault the inviting device generates the code
  // `<id>.<secret>` itself (docs/design/encryption.md, "Invitations") and
  // sends only id_hash, the invitation's key slots (exactly one for every
  // existing epoch, each wrapped to the invitation's key) and its
  // invite_anchor. The response then carries no code.
  //
  // Errors: INVALID_ARGUMENT for an unspecified role, a ttl_seconds above
  // the server maximum (30 days), or, in an end-to-end encrypted vault, a
  // missing or malformed id_hash or invite_anchor or slots that are not
  // exactly one per existing epoch for this invitation (in a plaintext
  // vault these fields must be unset); ALREADY_EXISTS for an id_hash that is
  // already in use; RESOURCE_EXHAUSTED when the vault already has the
  // maximum number of pending invitations (100).
  rpc CreateInvitation(CreateInvitationRequest) returns (CreateInvitationResponse) {}

  // ListInvitations lists the vault's pending invitations (not used, not
  // revoked, not expired), oldest first. Codes are never returned. The list
  // is bounded by the pending invitation limit.
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse) {}

  // RevokeInvitation revokes a pending invitation; its code can no longer be
  // redeemed.
  //
  // Errors: INVALID_ARGUMENT when invitation_id is not a canonical lowercase
  // UUID; NOT_FOUND when the vault has no such pending invitation.
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse) {}

  // GetInvitationSlots returns a pending invitation to an end-to-end
  // encrypted vault, its key slots, the vault's epochs and its invite
  // anchor, to the holder of the code's `<id>`: the first of the two
  // redemption steps (docs/design/encryption.md, "Invitations"). Any
  // authenticated user may call it; it names no vault.
  //
  // Errors: NOT_FOUND, with the same message whatever the reason, for an id
  // that is malformed, unknown, expired, revoked or already used.
  rpc GetInvitationSlots(GetInvitationSlotsRequest) returns (GetInvitationSlotsResponse) {}

  // RedeemInvitation makes the caller a member of the invitation's vault
  // with the invitation's role, and uses the invitation up. For an
  // invitation to an end-to-end encrypted vault the code is `<id>.<secret>`,
  // of which the server reads only `<id>`, and the request carries the
  // caller's own key slots, exactly one for every existing epoch; they are
  // stored and the invitation's slots deleted in the same transaction as the
  // membership. The caller must have a user key.
  //
  // Errors: NOT_FOUND, with the same message whatever the reason, for a code
  // that is malformed, unknown, expired, revoked or already used, so a
  // failed redemption reveals nothing about any vault; ALREADY_EXISTS when
  // the caller is already a member of the vault (the invitation stays
  // usable); RESOURCE_EXHAUSTED when the vault already has the maximum
  // number of members (100); INVALID_ARGUMENT when slots are set for a
  // plaintext vault, or, for an end-to-end encrypted vault, the caller has no
  // user key or slots are not exactly one per epoch wrapped to the caller;
  // FAILED_PRECONDITION with reason ERROR_REASON_EPOCH_NOT_CURRENT when the
  // vault gained an epoch after GetInvitationSlots (call it again).
  rpc RedeemInvitation(RedeemInvitationRequest) returns (RedeemInvitationResponse) {}

  // ListMembers lists the vault's members, oldest membership first. The list
  // is bounded by the member limit.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {}

  // UpdateMemberRole changes a member's role.
  //
  // Errors: INVALID_ARGUMENT when user_id is not a canonical lowercase UUID
  // or the role is unspecified; NOT_FOUND when the user is not a member;
  // FAILED_PRECONDITION when it would demote the vault's last owner.
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse) {}

  // RemoveMember removes a member from the vault. The revisions they
  // committed keep their history.
  //
  // In an end-to-end encrypted vault the request must carry next_epoch, the
  // epoch that replaces the current one, wrapped for every remaining member
  // with a user key (VaultKeyService): the removal and the new epoch take
  // effect together, as a compare-and-set on the current epoch, so no
  // revision is accepted under an epoch the removed member holds. Without a
  // valid next epoch nothing changes and the member stays. A plaintext
  // vault takes no next_epoch. An owner cannot remove themselves from an
  // end-to-end encrypted vault this way, because they would know the epoch
  // meant to exclude them; they leave with LeaveVault.
  //
  // The request also carries the new epoch's signed record, naming the
  // remove-member entry as its log position: the entry, the epoch and its
  // record are stored in one transaction.
  //
  // Errors: INVALID_ARGUMENT when user_id is not a canonical lowercase UUID,
  // when next_epoch is missing in an E2EE vault, given in a plaintext vault
  // or out of bounds, when its slots are not exactly the new epoch's
  // recipients (the removed member is not one), when record is given
  // without next_epoch, or when record is missing in an E2EE vault, not
  // signed by an owner at log_entry, names another log position or lists
  // other recipients than the log's (as RotateEpoch); NOT_FOUND when the user is
  // not a member; FAILED_PRECONDITION when it would remove the vault's last
  // owner, when the caller removes themselves from an E2EE vault, or,
  // with an ErrorDetail of reason ERROR_REASON_EPOCH_NOT_CURRENT,
  // when next_epoch.expected_epoch is not the vault's current epoch.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse) {}

  // LeaveVault removes the caller from the vault. Any member may call it.
  // In an end-to-end encrypted vault it marks a rotation pending, for an
  // owner client to create the next epoch (VaultKeyService.RotateEpoch);
  // until then revisions are still accepted under the current epoch.
  //
  // Errors: FAILED_PRECONDITION when the caller is the vault's last owner.
  rpc LeaveVault(LeaveVaultRequest) returns (LeaveVaultResponse) {}
}

// Invitation is a pending invitation to a vault. It never carries the code.
message Invitation {
  // Invitation id (UUIDv7).
  string id = 1;
  // The role the redeeming user receives.
  VaultRole role = 2;
  // User id of the owner who created the invitation.
  string creator_user_id = 3;
  // When the invitation was created.
  google.protobuf.Timestamp create_time = 4;
  // When the invitation expires; it cannot be redeemed from then on.
  google.protobuf.Timestamp expire_time = 5;
}

// Member is one member of a vault.
message Member {
  // The member's user id (UUIDv7).
  string user_id = 1;
  // The member's display name. May be empty.
  string display_name = 2;
  // The member's role.
  VaultRole role = 3;
  // When the user became a member.
  google.protobuf.Timestamp join_time = 4;
  // The member's hybrid ML-KEM-768 + X25519 user public key (1216 bytes,
  // docs/design/crypto.md) for wrapping vault epoch keys to them, or empty when they have no user key
  // (UserKeyService).
  bytes public_key = 5;
}

// CreateInvitationRequest describes the invitation to create.
message CreateInvitationRequest {
  // The vault to invite to. The caller must be an owner.
  string vault_id = 1;
  // The role the redeeming user receives. Must not be unspecified.
  VaultRole role = 2;
  // How long the invitation stays redeemable, in seconds. Zero selects the
  // server default (7 days); the maximum is 30 days.
  uint32 ttl_seconds = 3;
  // The signed invite entry of an end-to-end encrypted vault's membership
  // log (docs/design/crypto.md): required there, and must be unset in a
  // plaintext vault. Its invitation id becomes the invitation's id and its
  // role must be the requested role.
  LogEntry log_entry = 4;
  // End-to-end encrypted vaults only: SHA-256 of the 16 bytes that `<id>`
  // (22 characters of base64url without padding) encodes. The server stores
  // only this hash.
  bytes id_hash = 5;
  // End-to-end encrypted vaults only: the vault's epoch keys wrapped to the
  // invitation's key, exactly one slot (KEY_RECIPIENT_KIND_INVITATION, this
  // invitation's id) for every existing epoch.
  repeated KeySlot slots = 6;
  // End-to-end encrypted vaults only: the invite anchor (96 bytes,
  // docs/design/crypto.md), returned by GetInvitationSlots.
  bytes invite_anchor = 7;
}

// CreateInvitationResponse returns the invitation and its code.
message CreateInvitationResponse {
  // The new invitation.
  Invitation invitation = 1;
  // The secret invite code to hand to the invited user. It is shown only
  // once and cannot be retrieved later. Empty for an end-to-end encrypted
  // vault, whose code the inviting device generated.
  string code = 2;
}

// ListInvitationsRequest names the vault whose invitations to list.
message ListInvitationsRequest {
  // The vault. The caller must be an owner.
  string vault_id = 1;
}

// ListInvitationsResponse holds the vault's pending invitations.
message ListInvitationsResponse {
  // Pending invitations, oldest first.
  repeated Invitation invitations = 1;
}

// RevokeInvitationRequest names the invitation to revoke.
message RevokeInvitationRequest {
  // The vault. The caller must be an owner.
  string vault_id = 1;
  // Id of a pending invitation to the vault (Invitation.id).
  string invitation_id = 2;
  // The signed revoke-invitation entry for invitation_id: required in an
  // end-to-end encrypted vault, and must be unset in a plaintext vault. In
  // an end-to-end encrypted vault an invitation that has expired but is
  // still pending in the log can be revoked this way.
  LogEntry log_entry = 3;
}

// RevokeInvitationResponse confirms the revocation. It has no fields.
message RevokeInvitationResponse {}

// GetInvitationSlotsRequest names an invitation by its code's `<id>`.
message GetInvitationSlotsRequest {
  // The `<id>` part of an end-to-end encrypted vault's invite code.
  string id = 1;
}

// GetInvitationSlotsResponse is what a newcomer needs to unwrap the vault's
// epoch keys and wrap them to itself.
message GetInvitationSlotsResponse {
  // The invitation id, which the invitation's key pair is derived from.
  string invitation_id = 1;
  // The vault the invitation is to.
  string vault_id = 2;
  // The role the redeeming user receives.
  VaultRole role = 3;
  // The invitation's key slots, one per epoch, in ascending epoch order.
  repeated KeySlot slots = 4;
  // The vault's epochs with their commitments and records, ascending.
  repeated KeyEpoch epochs = 5;
  // The invite anchor stored with CreateInvitation.
  bytes invite_anchor = 6;
}

// RedeemInvitationRequest carries the invite code.
message RedeemInvitationRequest {
  // The code from CreateInvitationResponse.code, or, for an end-to-end
  // encrypted vault, the `<id>.<secret>` code the inviting device generated.
  string code = 1;
  // The redeem entry, signed by the invitation key and then by the caller,
  // carrying the caller's bundle: required for an invitation to an
  // end-to-end encrypted vault, and must be unset for a plaintext vault.
  LogEntry log_entry = 2;
  // End-to-end encrypted vaults only: the caller's own key slots
  // (KEY_RECIPIENT_KIND_USER, the caller's user id), exactly one for every
  // existing epoch.
  repeated KeySlot slots = 3;
}

// RedeemInvitationResponse returns the vault the caller joined.
message RedeemInvitationResponse {
  // The vault, with the caller's new role.
  Vault vault = 1;
}

// ListMembersRequest names the vault whose members to list.
message ListMembersRequest {
  // The vault. The caller must be an owner.
  string vault_id = 1;
}

// ListMembersResponse holds the vault's members.
message ListMembersResponse {
  // Members, oldest membership first.
  repeated Member members = 1;
}

// UpdateMemberRoleRequest names the member and their new role.
message UpdateMemberRoleRequest {
  // The vault. The caller must be an owner.
  string vault_id = 1;
  // The member's user id (Member.user_id), a canonical lowercase UUID.
  string user_id = 2;
  // The new role. Must not be unspecified.
  VaultRole role = 3;
  // The signed set-role entry for user_id and role: required in an
  // end-to-end encrypted vault, and must be unset in a plaintext vault.
  LogEntry log_entry = 4;
}

// UpdateMemberRoleResponse returns the updated member.
message UpdateMemberRoleResponse {
  // The member with their new role.
  Member member = 1;
}

// RemoveMemberRequest names the member to remove.
message RemoveMemberRequest {
  // The vault. The caller must be an owner.
  string vault_id = 1;
  // The member's user id (Member.user_id), a canonical lowercase UUID.
  string user_id = 2;
  // The epoch that replaces the current one: required in an end-to-end
  // encrypted vault, and must be unset in a plaintext vault. Its slots must
  // wrap the new epoch key to every remaining member with a user key (plus
  // at most one escrow slot in an escrow vault), and not to the removed
  // member.
  NextEpoch next_epoch = 3;
  // The signed remove-member entry for user_id: required in an end-to-end
  // encrypted vault, and must be unset in a plaintext vault.
  LogEntry log_entry = 4;
  // next_epoch's signed record (docs/design/crypto.md): required with
  // next_epoch in an end-to-end encrypted vault, and must be unset in a
  // plaintext vault. It must be signed by an owner at log_entry's seq, name
  // log_entry as its log position, and list exactly the recipients the log
  // has after log_entry, which next_epoch's slots must match, as
  // VaultKeyService.RotateEpoch checks a record. It is stored with the
  // epoch (KeyEpoch.record).
  EpochRecord record = 5;
}

// RemoveMemberResponse confirms the removal. It has no fields.
message RemoveMemberResponse {}

// LeaveVaultRequest names the vault to leave.
message LeaveVaultRequest {
  // The vault. The caller must be a member.
  string vault_id = 1;
  // The leave entry for the caller, signed by the caller: required in an
  // end-to-end encrypted vault, and must be unset in a plaintext vault.
  LogEntry log_entry = 2;
}

// LeaveVaultResponse confirms the caller left. It has no fields.
message LeaveVaultResponse {}
