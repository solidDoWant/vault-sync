name: sim-nightly

# The long sync simulation (docs/testing/simulation.md, SPEC.md §13): many
# seeds and steps with engines whose users make random changes, every night
# on master. Each night runs new seeds (the first seed moves with the run
# number), so coverage grows over time; any failing seed is replayable with
# the command in the issue this workflow files.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: Number of seeds
        default: "50"
      steps:
        description: Steps per seed
        default: "3000"
      first_seed:
        description: First seed (empty for the run-number rotation)
        default: ""
      property_runs:
        description: Engine property suite cases per property
        default: "100000"
      property_seed:
        description: Engine property suite seed (empty for the run-number rotation)
        default: ""

# Least privilege: the default token only reads; the job adds issues: write
# for filing the failure.
permissions:
  contents: read

concurrency:
  group: sim-nightly
  cancel-in-progress: false

jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
      issues: write
    env:
      # Inputs reach the scripts only through the environment, never
      # interpolated into a script.
      SEEDS: ${{ inputs.seeds || '50' }}
      STEPS: ${{ inputs.steps || '3000' }}
      FIRST_SEED: ${{ inputs.first_seed }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-dev-shell
      - name: Long simulation
        id: simulation
        run: |
          set -euo pipefail
          [[ $SEEDS =~ ^[0-9]+$ && $STEPS =~ ^[0-9]+$ && $RUN_NUMBER =~ ^[0-9]+$ ]] || { echo "seeds and steps must be numbers" >&2; exit 2; }
          if [[ -z $FIRST_SEED ]]; then FIRST_SEED=$(( 100000 + RUN_NUMBER * SEEDS )); fi
          [[ $FIRST_SEED =~ ^[0-9]+$ ]] || { echo "first_seed must be a number" >&2; exit 2; }
          echo "seeds $FIRST_SEED to $(( FIRST_SEED + SEEDS - 1 )), $STEPS steps"
          # Failing seeds are minimized into a copy of the committed cases,
          # uploaded below; the checkout stays clean.
          mkdir -p build/sim-regressions
          cp sim/regressions/*.json build/sim-regressions/
          nix develop -c make test-sim \
            SIM_FIRST_SEED="$FIRST_SEED" SIM_SEEDS="$SEEDS" SIM_STEPS="$STEPS" \
            SIM_CLIENTS=3 SIM_ENGINES=2 SIM_SHRINK_RUNS=10 SIM_TIMEOUT=300m \
            SIM_REGRESSION_DIR=build/sim-regressions 2>&1 | tee build/sim-output.txt
      - name: Binding-shadow report
        if: always()
        run: |
          set -euo pipefail
          touch build/sim-output.txt
          ./scripts/sim-shadow-report.sh build/sim-output.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the minimized cases
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-regressions
          path: |
            build/sim-regressions/
            build/sim-output.txt
          retention-days: 30
      - name: File an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          touch build/sim-output.txt
          ./scripts/sim-nightly-report.sh build/sim-output.txt "$RUN_URL" > build/sim-issue.md
          seeds=$(grep -oE 'SIM FAILURE: seed [0-9]+' build/sim-output.txt | grep -oE '[0-9]+$' | sort -nu | head -10 | paste -sd, - | sed 's/,/, /g' || true)
          title="sim: nightly simulation failed${seeds:+ (seeds $seeds)}"
          # One open issue at a time: later failures are added to it as comments.
          existing=$(gh issue list --state open --search 'in:title "sim: nightly simulation failed"' --json number --jq '.[0].number // empty')
          if [[ -n $existing ]]; then
            gh issue comment "$existing" --body-file build/sim-issue.md
          else
            gh issue create --title "$title" --body-file build/sim-issue.md
          fi

  # The same seeds on the faithful-filesystem vault (SIM_FAITHFUL_FS=1,
  # refactor step R2 of docs/design/engine-path-ownership.md): the engines'
  # vaults hold `Straße.md` next to `STRASSE.md` as NTFS and APFS do, and the
  # path pool adds the spellings where the server's path key and the device's
  # filesystem disagree. The engine is expected to fail there until step R7,
  # so this job is non-gating: it reports in its summary and artifact, files
  # no issue, and never fails the workflow. Step R7 makes it the default.
  simulation-faithful-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    continue-on-error: true
    permissions:
      contents: read
    env:
      SEEDS: ${{ inputs.seeds || '50' }}
      STEPS: ${{ inputs.steps || '3000' }}
      FIRST_SEED: ${{ inputs.first_seed }}
      RUN_NUMBER: ${{ github.run_number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-dev-shell
      - name: Long simulation on the faithful filesystem
        run: |
          set -euo pipefail
          [[ $SEEDS =~ ^[0-9]+$ && $STEPS =~ ^[0-9]+$ && $RUN_NUMBER =~ ^[0-9]+$ ]] || { echo "seeds and steps must be numbers" >&2; exit 2; }
          if [[ -z $FIRST_SEED ]]; then FIRST_SEED=$(( 100000 + RUN_NUMBER * SEEDS )); fi
          [[ $FIRST_SEED =~ ^[0-9]+$ ]] || { echo "first_seed must be a number" >&2; exit 2; }
          echo "seeds $FIRST_SEED to $(( FIRST_SEED + SEEDS - 1 )), $STEPS steps, faithful filesystem"
          mkdir -p build/sim-regressions
          cp sim/regressions/*.json build/sim-regressions/
          # Only the seeded schedules (the seeds suite): the scripted
          # scenarios were written for the folded vault, and each regression
          # case replays with the setting it recorded, which the gating job
          # already covers. The exit status goes into the summary instead of
          # failing the step.
          status=0
          SIM_FAITHFUL_FS=1 VAULT_SYNC_SIM_SUITES=seeds \
            SIM_FIRST_SEED="$FIRST_SEED" SIM_SEEDS="$SEEDS" SIM_STEPS="$STEPS" \
            SIM_CLIENTS=3 SIM_ENGINES=2 SIM_SHRINK_RUNS=10 SIM_TIMEOUT=300m \
            SIM_REGRESSION_DIR=build/sim-regressions \
            nix develop -c make test-sim > build/sim-output.txt 2>&1 || status=$?
          tail -n 200 build/sim-output.txt
          {
            echo "## Faithful-filesystem simulation (non-gating until R7)"
            echo
            echo "Seeds $FIRST_SEED to $(( FIRST_SEED + SEEDS - 1 )), $STEPS steps: the simulation exited with status $status."
            echo
            if [[ $status -ne 0 ]]; then
              ./scripts/sim-nightly-report.sh build/sim-output.txt "$RUN_URL" sim-faithful-fs \
                "The faithful-filesystem simulation failed (non-gating until R7: no issue is filed and the workflow does not fail)"
            fi
            echo
            ./scripts/sim-shadow-report.sh build/sim-output.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the output and minimized cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-faithful-fs
          path: |
            build/sim-regressions/
            build/sim-output.txt
          retention-days: 30

  # The engine property suite (plugin/src/core/engine/properties.test.ts) at
  # the nightly size of docs/design/engine-path-ownership.md §9.3 and §10.2
  # (E2): 100,000 cases per property, from a seed that moves with the run
  # number, so coverage grows over time. Known failures fail on their pinned
  # counterexample first; a property that holds must hold over every case. A
  # failure files one issue (later ones are comments on it) with the replay
  # command.
  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    env:
      PROPERTY_RUNS: ${{ inputs.property_runs || '100000' }}
      PROPERTY_SEED: ${{ inputs.property_seed }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-dev-shell
      - name: Engine property suite
        run: |
          set -euo pipefail
          [[ $PROPERTY_RUNS =~ ^[0-9]+$ && $RUN_NUMBER =~ ^[0-9]+$ ]] || { echo "property_runs must be a number" >&2; exit 2; }
          if [[ -z $PROPERTY_SEED ]]; then PROPERTY_SEED=$(( 563 + RUN_NUMBER )); fi
          [[ $PROPERTY_SEED =~ ^[0-9]+$ ]] || { echo "property_seed must be a number" >&2; exit 2; }
          echo "PROPERTY_SEED=$PROPERTY_SEED" >> "$GITHUB_ENV"
          echo "$PROPERTY_RUNS cases per property, seed $PROPERTY_SEED"
          mkdir -p build
          nix develop -c make test-properties PROPERTY_RUNS="$PROPERTY_RUNS" PROPERTY_SEED="$PROPERTY_SEED" 2>&1 | tee build/properties-output.txt
      - name: Upload the output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: properties
          path: build/properties-output.txt
          retention-days: 30
      - name: File an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p build
          touch build/properties-output.txt
          {
            echo "The nightly engine property suite failed: $PROPERTY_RUNS cases per property, seed ${PROPERTY_SEED:-unknown} ([run]($RUN_URL))."
            echo
            echo "Replay with \`make test-properties PROPERTY_RUNS=$PROPERTY_RUNS PROPERTY_SEED=${PROPERTY_SEED:-unknown}\`; fast-check's report below names the counterexample and its replay path."
            echo
            echo '```'
            grep -E 'FAIL|AssertionError|Counterexample|Got |violated|harness threw' build/properties-output.txt | head -60 || true
            echo '```'
          } > build/properties-issue.md
          # One open issue at a time: later failures are added to it as comments.
          existing=$(gh issue list --state open --search 'in:title "properties: nightly engine property suite failed"' --json number --jq '.[0].number // empty')
          if [[ -n $existing ]]; then
            gh issue comment "$existing" --body-file build/properties-issue.md
          else
            gh issue create --title "properties: nightly engine property suite failed (seed ${PROPERTY_SEED:-unknown})" --body-file build/properties-issue.md
          fi
