name: acceptance

# The acceptance scoreboard (`make acceptance`, docs/acceptance/phase-2.md):
# every night on master, runs each scenario's tests and uploads the
# scoreboard. Informational: it is not a required check and files nothing; a
# scenario without a passing test is a line on the scoreboard, not a red run.
# The Android device checks (AC-21) need an emulator: the scoreboard takes
# their results from the latest completed android-e2e run on master.

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Downloading the latest android-e2e run's results artifact.
  actions: read

concurrency:
  group: acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Downloaded Obsidian installers, app bundles and chromedriver, shared
      # with ci.yml's plugin-e2e job.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: plugin/.wdio-obsidian-cache
          key: obsidian-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('plugin/wdio.conf.mts') }}
      - uses: ./.github/actions/nix-dev-shell
      - uses: ./.github/actions/test-images
      - name: Download the latest Android device checks' results
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-results"
          run=$(gh run list --workflow android-e2e.yml --branch master --status completed --limit 1 --json databaseId,url,createdAt,conclusion \
            --jq '.[0] // empty | "\(.databaseId) \(.url) \(.createdAt) \(.conclusion)"')
          if [[ -z "$run" ]]; then
            echo "no completed android-e2e run on master; the Android device checks show as not run" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          read -r id url created conclusion <<<"$run"
          echo "Android device checks from android-e2e run $url ($created, $conclusion)" | tee -a "$GITHUB_STEP_SUMMARY"
          gh run download "$id" --name android-e2e-results --dir "$RUNNER_TEMP/android-results" ||
            echo "that run uploaded no results; the Android device checks show as not run" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Acceptance scoreboard
        env:
          VAULT_SYNC_ACCEPTANCE_ANDROID_RESULTS: ${{ runner.temp }}/android-results
        run: |
          nix develop -c make acceptance
          { echo '```'; cat build/acceptance/scoreboard.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the scoreboard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-scoreboard
          path: build/acceptance/
          retention-days: 30
