name: acceptance

# The acceptance scoreboard (`make acceptance`, docs/acceptance/phase-2.md):
# every night on master, runs each scenario's tests and uploads the
# scoreboard. Informational: it is not a required check and files nothing; a
# scenario without a passing test is a line on the scoreboard, not a red run.

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Downloaded Obsidian installers, app bundles and chromedriver, shared
      # with ci.yml's plugin-e2e job.
      - uses: actions/cache@v4
        with:
          path: plugin/.wdio-obsidian-cache
          key: obsidian-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('plugin/wdio.conf.mts') }}
      - uses: ./.github/actions/nix-dev-shell
      - uses: ./.github/actions/test-images
      - name: Acceptance scoreboard
        run: |
          nix develop -c make acceptance
          { echo '```'; cat build/acceptance/scoreboard.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the scoreboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-scoreboard
          path: build/acceptance/
          retention-days: 30
