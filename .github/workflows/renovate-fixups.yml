name: renovate-fixups

# Renovate updates go.mod/go.sum and the compose image tags but not the pins
# derived from them: vendorHash in nix/server.nix and the versitygw version and
# checksums in scripts/with-native-s3.sh. This workflow regenerates both on
# Renovate's PR branches and pushes the result. GitHub creates the
# pull_request runs of ci and of this workflow for a push made with
# GITHUB_TOKEN, but holds them as "action required" (the PR page shows
# "workflows awaiting approval"). Only these pull_request runs count for
# branch protection, so the job approves the held ci run to start it. The held
# run of this workflow would only find nothing to fix up, and starting it would
# cancel this job through the concurrency group, so the job deletes it instead.
# pull_request cannot filter on the head branch, so the job's condition limits
# it to renovate/* branches of this repository; on every other PR it is skipped.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: renovate-fixups-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  fixups:
    if: startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the fix-up commit to the PR branch
      actions: write # approve or delete the held runs of the fix-up commit
      checks: read # find the held runs through the commit's check suites
    env:
      BRANCH: ${{ github.head_ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - id: detect
        name: Detect what needs regenerating
        run: |
          if git diff --quiet "$(git merge-base "$BASE_SHA" HEAD)" HEAD -- go.sum; then
            echo "go_sum=false" >>"$GITHUB_OUTPUT"
          else
            echo "go_sum=true" >>"$GITHUB_OUTPUT"
          fi
          tag="$(sed -nE 's|^ *image: mirror\.gcr\.io/versity/versitygw:(v[0-9.]+)@.*$|\1|p' deploy/compose/compose.test.yaml)"
          if ./scripts/with-native-s3.sh --check-pin; then
            echo "versitygw=" >>"$GITHUB_OUTPUT"
          else
            echo "versitygw=${tag}" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.detect.outputs.go_sum == 'true'
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - if: steps.detect.outputs.go_sum == 'true'
        run: make update-vendor-hash
      - if: steps.detect.outputs.versitygw != ''
        env:
          VERSITYGW_VERSION: ${{ steps.detect.outputs.versitygw }}
        run: |
          ./scripts/with-native-s3.sh --update-pin "$VERSITYGW_VERSION"
          ./scripts/with-native-s3.sh --check-pin
      - id: push
        name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- nix/server.nix scripts/with-native-s3.sh; then
            echo "nothing to fix up"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nix/server.nix scripts/with-native-s3.sh
          git commit -m 'chore(deps): regenerate pins derived from the Renovate update'
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      # The held runs are found through the commit's check suites, because the
      # REST run list leaves some of them out. They appear a few seconds after
      # the push, so the step polls for a minute and handles each one as it
      # appears. An approved or deleted run can still be listed for a few
      # seconds; repeating the call then fails, so only calls that work count.
      - name: Approve the held pull_request runs of the fix-up commit
        if: steps.push.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.push.outputs.sha }}
        run: |
          query='query($owner: String!, $name: String!, $sha: GitObjectID!) {
            repository(owner: $owner, name: $name) {
              object(oid: $sha) {
                ... on Commit {
                  checkSuites(first: 100) {
                    nodes { conclusion workflowRun { databaseId event workflow { name } } }
                  }
                }
              }
            }
          }'
          filter='.data.repository.object.checkSuites.nodes[]
            | select(.conclusion == "ACTION_REQUIRED" and .workflowRun.event == "pull_request")
            | "\(.workflowRun.databaseId) \(.workflowRun.workflow.name)"'
          approved=0
          for _ in $(seq 1 12); do
            sleep 5
            runs="$(gh api graphql -f query="$query" -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -f sha="$SHA" --jq "$filter")"
            while read -r id workflow; do
              [[ -n $id ]] || continue
              if [[ $workflow == "$GITHUB_WORKFLOW" ]]; then
                if gh api --silent -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}"; then
                  echo "deleted held ${workflow} run ${id}"
                fi
              elif gh api --silent -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve"; then
                echo "approved held ${workflow} run ${id}"
                approved=$((approved + 1))
              fi
            done <<<"$runs"
          done
          echo "approved ${approved} held run(s) for ${SHA}"
          if ((approved == 0)); then
            echo "::error::no held ci run was approved for ${SHA}; approve it on the PR page"
            exit 1
          fi
