name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists PR files via the API

# One group per branch. PRs: a newer push cancels the older run. master: the
# running run always finishes, and of the commits merged meanwhile only the
# newest waits (GitHub keeps one pending run per group and cancels older
# pending ones). The newest commit contains every earlier merge and PRs are
# tested before auto-merge, so this tests master continuously without stacking
# runs against the account's concurrent-job limit (20 on GitHub Free). A
# cancelled *pending* master run is expected, not a failure.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether anything that can affect build or test results changed.
  # Docs-only and agent-playbook-only changes skip every test job; the
  # required `checks` job below still runs and passes. `chart` covers the
  # docs the chart's coverage check reads (make chart-lint), so a docs-only
  # change to them still runs that check.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      chart: ${{ steps.filter.outputs.chart }}
      npm: ${{ steps.filter.outputs.npm }}
      # Windows/macOS e2e on PRs only when plugin-side files change; always on master.
      desktop: ${{ github.event_name != 'pull_request' || steps.filter.outputs.desktop == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!docs/**'
              - '!.claude/**'
              - '!scripts/agents/**'
              - '!LICENSE'
              - '!.github/renovate.json5'
              - '!.github/renovate/**'
            chart:
              - 'docs/{configuration,deployment}.md'
            desktop:
              - '{plugin/**,.github/**,nix/**,flake.*}'
            npm:
              - '{plugin/package.json,plugin/package-lock.json,scripts/npm-audit.sh}'

  # The test tiers run as parallel jobs (they used to be sequential steps of
  # one ~9 minute job). Everything runs inside the flake's dev shell so CI
  # uses exactly the toolchain developers and agents use.
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix-dev-shell
      - name: Lint
        run: nix develop -c make lint
      - name: Generated code is current
        run: nix develop -c make check-generate

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix-dev-shell
      - name: Unit tests
        run: nix develop -c make test
      - name: Build
        run: nix develop -c make build

  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The rolling-upgrade integration test builds the previous
          # release (where this change branched from master) from history.
          fetch-depth: 0
      - uses: ./.github/actions/nix-dev-shell
      # The test stack's images from the actions cache (#727).
      - uses: ./.github/actions/test-images
      - name: Integration tests
        run: nix develop -c make test-integration

  # The store/migration integration tests and the rolling-upgrade test on
  # PostgreSQL 14, the minimum supported version (docs/testing/integration.md),
  # so a migration that needs a newer PostgreSQL fails CI. The rest of the
  # suite runs only on the default image above.
  integration-postgres14:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The rolling-upgrade test builds the previous release from history.
          fetch-depth: 0
      - uses: ./.github/actions/nix-dev-shell
      # The test stack's images from the actions cache (#727).
      - uses: ./.github/actions/test-images
      - name: Integration tests on PostgreSQL 14
        run: nix develop -c make test-integration-postgres14

  # Release artifacts (docs/deployment.md): the Helm chart's lint and
  # rendered-manifest checks, and the Nix-built server image, whose binary
  # build-images checks with govulncheck. Building the image also fails when
  # go.mod/go.sum changed without updating vendorHash in nix/server.nix.
  # Nothing is pushed. A docs-only change to docs/configuration.md or
  # docs/deployment.md runs the chart checks (which check that every
  # documented variable can be set through the chart) but not the image.
  release-artifacts:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix-dev-shell
      - name: Chart lint and rendered-manifest checks
        run: nix develop -c make chart-lint
      - name: Build the server image (not pushed)
        if: needs.changes.outputs.code == 'true'
        run: nix develop -c make build-images

  # A short sync simulation (docs/testing/simulation.md): a few seeds
  # against the real server, plus the check that the harness catches a
  # deliberately broken server (issue #15: under 5 minutes).
  simulation:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix-dev-shell
      # The test stack's images from the actions cache (#727).
      - uses: ./.github/actions/test-images
      - name: Simulation
        run: nix develop -c make test-sim SIM_SEEDS=5 SIM_STEPS=1000

  # npm advisories, only when the plugin's dependency manifests (or the check
  # itself) change. Fails only on fixable moderate+ advisories in dependencies
  # the plugin ships; unfixable and dev-only ones are warnings
  # (scripts/npm-audit.sh).
  npm-audit:
    needs: changes
    if: needs.changes.outputs.npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix-dev-shell
      - name: npm vulnerabilities in shipped plugin dependencies
        run: nix develop -c make npm-audit

  # The plugin e2e suite in a pinned real Obsidian (docs/testing/e2e.md):
  # desktop on Linux, Windows (plugin changes and master) and macOS (ditto), plus Obsidian's emulated mobile mode
  # once on Linux.
  plugin-e2e:
    name: plugin-e2e (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Server-only PRs run the Linux legs only: OS-specific behavior lives in
      # the plugin, and the Windows/macOS runners dominate the queue.
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.desktop == 'true' && '[{"name":"ubuntu-latest","os":"ubuntu-latest","mobile":"0"},{"name":"windows-latest","os":"windows-latest","mobile":"0"},{"name":"macos-latest","os":"macos-latest","mobile":"0"},{"name":"emulated-mobile","os":"ubuntu-latest","mobile":"1"}]' || '[{"name":"ubuntu-latest","os":"ubuntu-latest","mobile":"0"},{"name":"emulated-mobile","os":"ubuntu-latest","mobile":"1"}]') }}
    env:
      VAULT_SYNC_E2E_MOBILE: ${{ matrix.mobile }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # Downloaded Obsidian installers, app bundles and chromedriver, keyed
      # on the file that pins the Obsidian version.
      - uses: actions/cache@v4
        with:
          path: plugin/.wdio-obsidian-cache
          key: obsidian-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('plugin/wdio.conf.mts') }}

      # Linux: the flake's toolchain, docker compose PostgreSQL + S3 and
      # xvfb, exactly as `make test-e2e` runs in the dev VM.
      - if: runner.os == 'Linux'
        uses: ./.github/actions/nix-dev-shell
      - if: runner.os == 'Linux'
        uses: ./.github/actions/test-images
      - if: runner.os == 'Linux'
        name: Plugin e2e (Linux, Nix dev shell)
        run: nix develop -c make test-e2e

      # Windows and macOS: no Nix (Windows) and no Linux containers, so the
      # toolchain comes from setup-* actions, PostgreSQL runs natively, and
      # scripts/with-native-s3.sh runs the pinned versitygw release natively
      # as the S3-compatible store.
      # v6 installs the version of go.mod's `toolchain` directive (the
      # minimum patched Go, also read by flake.nix), not its `go` line.
      - if: runner.os != 'Linux'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - if: runner.os != 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - if: runner.os == 'macOS'
        id: postgres-macos
        uses: ikalnytskyi/action-setup-postgres@v8
      # Windows: the PostgreSQL the runner image preinstalls (disabled
      # service, superuser `postgres` with the image's documented password
      # `root`). action-setup-postgres would `choco install` it, which fails
      # whenever the Chocolatey community feed is down (#272).
      - if: runner.os == 'Windows'
        id: postgres-windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = & "$env:PGBIN\pg_config.exe" --version
          if ($version -notmatch '^PostgreSQL (\d+)') { throw "unexpected pg_config version: $version" }
          $major = [int]$Matches[1]
          Write-Output "preinstalled $version"
          if ($major -lt 14) { throw "preinstalled PostgreSQL $major is older than the minimum supported 14" }
          $service = "postgresql-x64-$major"
          Set-Service -Name $service -StartupType Manual
          Start-Service -Name $service
          & "$env:PGBIN\pg_isready.exe" -h localhost -p 5432 -t 60
          $env:PGPASSWORD = 'root'
          & "$env:PGBIN\psql.exe" -h localhost -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'SELECT version()'
          "connection-uri=postgresql://postgres:root@localhost:5432/postgres" >> $env:GITHUB_OUTPUT
      - if: runner.os != 'Linux'
        name: Build plugin
        working-directory: plugin
        # make plugin-build without make.
        run: |
          npm ci
          npm run build
          cp manifest.json dist/
      - if: runner.os != 'Linux'
        name: Plugin e2e (native)
        env:
          VAULT_SYNC_TEST_DATABASE_URL: ${{ steps.postgres-macos.outputs.connection-uri || steps.postgres-windows.outputs.connection-uri }}
          VAULT_SYNC_E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs
        run: ./scripts/with-native-s3.sh go test -count=1 -tags e2e -timeout 20m -run TestPluginE2E -v ./cmd/vault-sync-server/
      # WebdriverIO and verbose chromedriver logs, with Obsidian's own
      # stderr, for telling a crashed Obsidian from a failed test (#457).
      - if: failure() && runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 14

  # The single required status check (it also covers the plugin-e2e matrix,
  # whose per-OS check names are not reported when the job is skipped). It
  # always runs, so docs-only changes
  # still produce a passing `checks`; it fails if any tier failed or was
  # cancelled, and passes when they succeeded or were skipped by the filter.
  checks:
    needs: [changes, lint, unit, integration, integration-postgres14, simulation, plugin-e2e, release-artifacts, npm-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All test tiers passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a required job ended with: $result" >&2; exit 1 ;;
            esac
          done
