name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The single required check. Everything runs inside the flake's dev shell so
  # CI uses exactly the toolchain developers and agents use.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The rolling-upgrade integration test builds the previous
          # release (where this change branched from master) from history.
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Lint
        run: nix develop -c make lint
      - name: Unit tests
        run: nix develop -c make test
      - name: Integration tests
        run: nix develop -c make test-integration
      # A short sync simulation (docs/testing/simulation.md): a few seeds
      # against the real server, plus the check that the harness catches a
      # deliberately broken server (issue #15: under 5 minutes).
      - name: Simulation
        run: nix develop -c make test-sim SIM_SEEDS=5 SIM_STEPS=1000
        timeout-minutes: 10
      - name: Generated code is current
        run: nix develop -c make check-generate
      - name: Build
        run: nix develop -c make build
