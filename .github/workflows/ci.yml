name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The single required check. Everything runs inside the flake's dev shell so
  # CI uses exactly the toolchain developers and agents use.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The rolling-upgrade integration test builds the previous
          # release (where this change branched from master) from history.
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Lint
        run: nix develop -c make lint
      - name: Unit tests
        run: nix develop -c make test
      - name: Integration tests
        run: nix develop -c make test-integration
      # A short sync simulation (docs/testing/simulation.md): a few seeds
      # against the real server, plus the check that the harness catches a
      # deliberately broken server (issue #15: under 5 minutes).
      - name: Simulation
        run: nix develop -c make test-sim SIM_SEEDS=5 SIM_STEPS=1000
        timeout-minutes: 10
      - name: Generated code is current
        run: nix develop -c make check-generate
      - name: Build
        run: nix develop -c make build

  # The plugin e2e suite in a pinned real Obsidian (docs/testing/e2e.md):
  # desktop on Linux, Windows and macOS, plus Obsidian's emulated mobile mode
  # once on Linux.
  plugin-e2e:
    name: plugin-e2e (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-latest, os: ubuntu-latest, mobile: "0" }
          - { name: windows-latest, os: windows-latest, mobile: "0" }
          - { name: macos-latest, os: macos-latest, mobile: "0" }
          - { name: emulated-mobile, os: ubuntu-latest, mobile: "1" }
    env:
      VAULT_SYNC_E2E_MOBILE: ${{ matrix.mobile }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # Downloaded Obsidian installers, app bundles and chromedriver, keyed
      # on the file that pins the Obsidian version.
      - uses: actions/cache@v4
        with:
          path: plugin/.wdio-obsidian-cache
          key: obsidian-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('plugin/wdio.conf.mts') }}

      # Linux: the flake's toolchain, docker compose PostgreSQL + S3 and
      # xvfb, exactly as `make test-e2e` runs in the dev VM.
      - if: runner.os == 'Linux'
        uses: cachix/install-nix-action@v31
      - if: runner.os == 'Linux'
        name: Plugin e2e
        run: nix develop -c make test-e2e

      # Windows and macOS: no Nix (Windows) and no Linux containers, so the
      # toolchain comes from setup-* actions and PostgreSQL runs natively.
      # The server runs without an object store, which it does not need yet.
      - if: runner.os != 'Linux'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: runner.os != 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - if: runner.os != 'Linux'
        id: postgres
        uses: ikalnytskyi/action-setup-postgres@v8
      - if: runner.os != 'Linux'
        name: Build plugin
        working-directory: plugin
        # make plugin-build without make.
        run: |
          npm ci
          npm run build
          cp manifest.json dist/
      - if: runner.os != 'Linux'
        name: Plugin e2e
        env:
          VAULT_SYNC_TEST_DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}
        run: go test -count=1 -tags e2e -timeout 20m -run TestPluginE2E -v ./cmd/vault-sync-server/
