---
# vault-sync Helm chart values. docs/deployment.md describes every value and
# walks through a full deployment; docs/admin/configuration-reference.md
# describes every VAULT_SYNC_* variable the values below set.
#
# `config` is this chart's own interface: the chart turns it into the server
# Deployment ("main"), the export CronJob ("export"), their Services, Secret
# mounts and environment. `resources` is passed to the bjw-s common library
# chart and deep-merged over what the chart computes, so anything the library
# supports can be overridden or added there.
#
# Secrets are never created by this chart: every credential is a reference to
# a Secret you create (for example with cert-manager, CloudNativePG or
# external-secrets). Only the named keys of each Secret are projected into
# the pods, as a directory (never with subPath), so a rotated Secret reaches
# the running pods without a restart.
config:
  # logLevel sets VAULT_SYNC_LOG_LEVEL on the server and the export job:
  # debug, info, warn or error. null uses the server default (info).
  logLevel: null

  # database configures PostgreSQL for the server. The export job uses the
  # same settings unless config.export.database overrides them.
  database:
    # url is VAULT_SYNC_DATABASE_URL (required): a postgres:// URL or libpq
    # keyword/value string, without sslcert/sslkey. Set exactly one of value
    # (only if it holds no password) or secretKeyRef.
    url:
      value: ""
      secretKeyRef:
        name: ""
        key: ""
    tls:
      # clientCertificate names a Secret holding the PostgreSQL client
      # certificate and key, for example a kubernetes.io/tls Secret from
      # cert-manager or the one CloudNativePG creates for a user. Mounted at
      # /etc/vault-sync/database-client-cert and passed as
      # VAULT_SYNC_DATABASE_TLS_CERT_FILE and VAULT_SYNC_DATABASE_TLS_KEY_FILE.
      clientCertificate:
        secretName: ""
        certKey: tls.crt
        keyKey: tls.key
      # caCert names the Secret key holding the CA bundle that signs the
      # PostgreSQL server certificate (for CloudNativePG, the
      # `<cluster>-ca` Secret, key ca.crt). Mounted at
      # /etc/vault-sync/database-ca and passed as
      # VAULT_SYNC_DATABASE_TLS_CA_FILE. Setting it turns on full verification
      # (docs/admin/postgresql-and-s3.md, PostgreSQL TLS).
      caCert:
        secretKeyRef:
          name: ""
          key: ca.crt

  # s3 configures the object store holding file contents (required).
  s3:
    # bucket is VAULT_SYNC_S3_BUCKET (required). The bucket must exist.
    bucket: ""
    # endpoint is VAULT_SYNC_S3_ENDPOINT, for example the Ceph RGW URL. null
    # uses AWS S3.
    endpoint: null
    # region is VAULT_SYNC_S3_REGION. null uses the server default
    # (us-east-1).
    region: null
    # forcePathStyle is VAULT_SYNC_S3_FORCE_PATH_STYLE, a boolean.
    # null uses the server default (true).
    forcePathStyle: null
    # idleTimeout is VAULT_SYNC_S3_IDLE_TIMEOUT, a Go duration. null uses the
    # server default (2m).
    idleTimeout: null
    # credentials names the Secret holding the S3 access key id and secret
    # access key (required), and the keys within it. Mounted at
    # /etc/vault-sync/s3-credentials and passed as
    # VAULT_SYNC_S3_ACCESS_KEY_ID_FILE and VAULT_SYNC_S3_SECRET_ACCESS_KEY_FILE.
    # The defaults match the Secret that Rook creates for an
    # ObjectBucketClaim.
    credentials:
      secretName: ""
      accessKeyIdKey: AWS_ACCESS_KEY_ID
      secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
    # caCert names the Secret key holding a CA bundle for the S3 endpoint,
    # instead of the system roots. Mounted at /etc/vault-sync/s3-ca and passed
    # as VAULT_SYNC_S3_TLS_CA_FILE.
    caCert:
      secretKeyRef:
        name: ""
        key: ca.crt

  # oidc configures access-token validation
  # (docs/admin/identity-provider.md).
  oidc:
    # issuerUrl is VAULT_SYNC_OIDC_ISSUER_URL (required), for example
    # https://auth.example.com/application/o/vault-sync/ for Authentik.
    issuerUrl: ""
    # audience is VAULT_SYNC_OIDC_AUDIENCE (required): the client ID of the
    # vault-sync provider.
    audience: ""
    # clientId is VAULT_SYNC_OIDC_CLIENT_ID: the OAuth client the plugin signs
    # in as, when it differs from the audience. null leaves it unset.
    clientId: null

  # server holds the API server's tunables. Every null value leaves its
  # variable unset, so the server default applies (docs/admin/configuration-reference.md).
  # Byte sizes and counts are integers; durations are Go duration strings
  # such as 30s or 1h30m (values.schema.json checks both).
  # The listen addresses are fixed by the chart: the API on 8080
  # (VAULT_SYNC_LISTEN_ADDRESS) and metrics and health on 9090
  # (VAULT_SYNC_METRICS_LISTEN_ADDRESS), and service-wide metrics on 9091
  # (VAULT_SYNC_SERVICE_METRICS_LISTEN_ADDRESS).
  server:
    # VAULT_SYNC_MAX_REQUEST_BYTES. Keep it at or below the WAF's inspected
    # body limit (1 MiB by default).
    maxRequestBytes: null
    # VAULT_SYNC_WRITE_TIMEOUT.
    writeTimeout: null
    # VAULT_SYNC_MAX_CONCURRENT_RPCS_PER_USER.
    maxConcurrentRpcsPerUser: null
    # VAULT_SYNC_SHUTDOWN_DELAY and VAULT_SYNC_SHUTDOWN_TIMEOUT. The chart
    # sets the pod's terminationGracePeriodSeconds to their sum (5s + 30s
    # when unset) plus 10 seconds, and at least 45, and refuses to render if
    # an explicit resources.controllers.main.pod.terminationGracePeriodSeconds
    # is not larger than their sum.
    shutdownDelay: null
    shutdownTimeout: null
    blob:
      # VAULT_SYNC_BLOB_MAX_CHUNK_BYTES.
      maxChunkBytes: null
      # VAULT_SYNC_BLOB_MAX_SIZE_BYTES.
      maxSizeBytes: null
      # VAULT_SYNC_BLOB_MAX_UPLOADS_PER_VAULT.
      maxUploadsPerVault: null
      # VAULT_SYNC_BLOB_UPLOAD_TTL.
      uploadTtl: null
      # VAULT_SYNC_BLOB_UPLOAD_RECLAIM_IDLE.
      uploadReclaimIdle: null
      # VAULT_SYNC_BLOB_GC_GRACE.
      gcGrace: null
    retention:
      # VAULT_SYNC_RETENTION_KEEP_ALL.
      keepAll: null
      # VAULT_SYNC_RETENTION_KEEP_DAILY.
      keepDaily: null
      # VAULT_SYNC_RETENTION_PURGE_MARKER_HORIZON.
      purgeMarkerHorizon: null
      # VAULT_SYNC_RETENTION_OVERRIDE_MIN_KEEP_ALL: only read by the
      # `retention set` subcommand run in a server pod (docs/deployment.md).
      overrideMinKeepAll: null
      # VAULT_SYNC_RETENTION_OVERRIDE_MIN_KEEP_DAILY, likewise.
      overrideMinKeepDaily: null
    realtime:
      # VAULT_SYNC_REALTIME_MAX_CONNECTIONS.
      maxConnections: null
      # VAULT_SYNC_REALTIME_MAX_CONNECTIONS_PER_USER.
      maxConnectionsPerUser: null
      # VAULT_SYNC_REALTIME_MAX_SUBSCRIPTIONS.
      maxSubscriptions: null
    escrow:
      # VAULT_SYNC_ESCROW_RECIPIENT: the escrow public key, an age hybrid
      # recipient (age1pq1…). Public; the escrow private key goes into the
      # export job only (config.export.escrow).
      recipient: null
      # VAULT_SYNC_ESCROW_SIGNING_KEY: the escrow signing public key (base64
      # Ed25519), set together with recipient. Public; its private key stays
      # with the escrow identity.
      signingKey: null
      # VAULT_SYNC_ESCROW_DEFAULT: whether new encrypted vaults have escrow
      # unless their owner turns it off (true when unset).
      default: null
      # VAULT_SYNC_ESCROW_RETIRING_KEY_IDS: comma-separated ids of escrow
      # keys being rotated away from, which escrow slots may still name
      # until the export job has re-wrapped them all.
      retiringKeyIds: null
    metrics:
      # serviceMonitor creates a prometheus-operator ServiceMonitor scraping
      # /metrics on port "metrics" (9090) of the Service. Off by default; it
      # needs the monitoring.coreos.com CRDs.
      serviceMonitor:
        enabled: false
        interval: 1m
        scrapeTimeout: 10s
      serviceWide:
        # enabled adds a second endpoint to the ServiceMonitor, scraping the
        # service-wide /metrics on port "service-metrics" (9091) with the
        # same interval and timeout. Needs serviceMonitor.enabled. Every
        # replica serves the same values; to scrape only one, configure your
        # scraper instead.
        enabled: false
        # VAULT_SYNC_SERVICE_METRICS_INTERVAL: how often each replica reads
        # the service-wide metrics from PostgreSQL (served on 9091).
        interval: null

  # export configures the plaintext export CronJob (docs/export.md). It runs
  # `vault-sync-server export -out /export/<directory>` with its own Secret
  # mounts; the server Deployment never mounts the export's output or its
  # escrow key.
  #
  # Off by default, so a minimal install needs only the database, S3 and
  # OIDC settings. Turning it on is recommended: the export is the plaintext
  # disaster-recovery copy of every vault (docs/export.md).
  export:
    enabled: false
    # schedule is the CronJob schedule; timeZone is an optional IANA time
    # zone for it (the cluster's default otherwise).
    schedule: "0 3 * * *"
    timeZone: ""
    # activeDeadlineSeconds bounds one export run (6 hours by default):
    # runs never overlap (concurrencyPolicy Forbid), so a hung export, for
    # example on a stalled NFS volume, would otherwise block every later run.
    activeDeadlineSeconds: 21600
    output:
      # persistence is the volume the export writes to (required while the
      # export is enabled), as a bjw-s persistence item, for example
      #   persistence:
      #     type: persistentVolumeClaim
      #     existingClaim: vault-sync-export
      # or an nfs or hostPath volume that your tape-archival tooling reads.
      # The chart mounts it at /export; mount options other than the path
      # can be set here.
      persistence: {}
      # directory is the export directory inside the volume. The export
      # replaces it on every run and keeps a lock file and a staging
      # directory beside it, at the top of the volume.
      directory: vaults
    # database overrides config.database for the export, so it can use its
    # own read-only role (docs/export.md lists the grants it needs). Empty
    # fields fall back to config.database; the CA is always shared.
    database:
      url:
        value: ""
        secretKeyRef:
          name: ""
          key: ""
      tls:
        clientCertificate:
          secretName: ""
          certKey: tls.crt
          keyKey: tls.key
    # s3 overrides config.s3.credentials for the export, so it can use
    # read-only S3 credentials. An empty secretName falls back to
    # config.s3.credentials; the bucket, endpoint and CA are shared.
    s3:
      credentials:
        secretName: ""
        accessKeyIdKey: AWS_ACCESS_KEY_ID
        secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
    # escrow names the Secret holding the escrow identity (SPEC.md §9.4)
    # under key (the age-keygen -pq output; both identities during an escrow
    # key rotation). It is mounted read-only at /etc/vault-sync/escrow into
    # the export job only, which reads it as VAULT_SYNC_ESCROW_IDENTITY_FILE
    # to decrypt escrowed vaults; the chart refuses to render if any value
    # would put it into the server. The escrow signing keys never go into
    # the cluster: they stay offline and are used only by a manual escrow key
    # rotation (export rotate-escrow, docs/export.md), and the chart refuses
    # to render if any controller would get them.
    escrow:
      secretName: ""
      key: escrow.key
  # escrowJobToken names the Secret holding the static bearer token of the
  # export job's escrow rotation endpoint under key (one line, at least 32
  # characters, e.g. openssl rand -base64 32). It is mounted read-only at
  # /etc/vault-sync/escrow-job-token into the server, which checks it, and
  # the export job, which presents it, and nowhere else; both read it as
  # VAULT_SYNC_ESCROW_JOB_TOKEN_FILE. Empty turns the endpoint off.
  escrowJobToken:
    secretName: ""
    key: token

  # route renders a Gateway API HTTPRoute (through bjw-s `route`) sending
  # hostnames to port "http" of the Service. Only port "http" may be routed
  # to from outside the cluster. The chart sets the backend and the
  # timeouts: 15m for requests (a CommitBlob response starts only once the
  # server has composed the blob, up to 10 minutes) and none ("0s") for the
  # long-lived /v1/realtime WebSocket. resources.route.main overrides any
  # of it.
  route:
    enabled: false
    # hostnames the route matches, for example [sync.example.com].
    hostnames: []
    # parentRefs names the Gateway (and listener) to attach to, for example
    #   - name: internet-gateway
    #     namespace: gateway
    #     sectionName: https
    parentRefs: []
    annotations: {}
    labels: {}

  # grafana installs the vault-sync Grafana dashboards (Overview, Server,
  # Dependencies; JSON in the chart's dashboards/ directory, UIDs
  # vault-sync-overview, vault-sync-server and vault-sync-dependencies).
  # Both ways are off by default and may be combined.
  grafana:
    dashboards:
      # enabled renders one grafana-operator GrafanaDashboard
      # (grafana.integreatly.org/v1beta1) per dashboard. Needs the operator's
      # CRDs and instanceSelector.
      enabled: false
      # instanceSelector is the label selector of the Grafana resources to
      # import into, for example {matchLabels: {dashboards: grafana}}.
      # Required while enabled.
      instanceSelector: {}
      # At most one of folder (a folder title), folderRef (a GrafanaFolder
      # in this namespace) and folderUID (an existing folder's UID).
      folder: ""
      folderRef: ""
      folderUID: ""
      # resyncPeriod: how often the operator re-applies the dashboards, for
      # example 10m. null keeps the operator's default.
      resyncPeriod: null
      # allowCrossNamespaceImport lets Grafana instances in other namespaces
      # import the dashboards. null keeps the operator's default (false).
      allowCrossNamespaceImport: null
      # labels are added to each GrafanaDashboard.
      labels: {}
      # configMaps renders each dashboard as a ConfigMap labelled for the
      # Grafana chart's dashboard sidecar, for deployments without the
      # operator.
      configMaps:
        enabled: false
        # label and labelValue: the label the sidecar watches
        # (sidecar.dashboards.label and labelValue in the Grafana chart).
        label: grafana_dashboard
        labelValue: "1"
        # annotations of each ConfigMap, for example
        # {grafana_folder: vault-sync} with the sidecar's folderAnnotation.
        annotations: {}
  # alerts renders the packaged alerting rules (docs/admin/alerts.md, one runbook
  # section per alert) as a prometheus-operator PrometheusRule. Off by
  # default; it needs the monitoring.coreos.com CRDs, and the service-wide
  # alerts need config.server.metrics.serviceWide.enabled (or another scrape
  # of port "service-metrics").
  alerts:
    prometheusRule:
      enabled: false
      # labels and annotations are added to the PrometheusRule, for example
      # the labels your Prometheus's ruleSelector matches.
      labels: {}
      annotations: {}
      # selector adds matchers to every expression, so the rules see only
      # this release's metrics. null uses the release namespace and the
      # Service name (the ServiceMonitor's job label); "" leaves the
      # matcher out. kube-state-metrics alerts match the namespace and the
      # Deployment name instead of the job.
      selector:
        namespace: null
        job: null
    # runbookUrlBase: each alert's runbook_url annotation is this plus
    # "#<alert name in lower case>". Empty leaves runbook_url out.
    runbookUrlBase: https://github.com/solidDoWant/vault-sync/blob/master/docs/admin/alerts.md
    # rules overrides single alerts by name, for example
    #   VaultSyncSyncLatencyHigh: {threshold: 5, for: 30m}
    #   VaultSyncConcurrencyRejections: {enabled: false}
    #   VaultSyncNoReplicaReady: {enabled: true}  # needs kube-state-metrics
    # with keys enabled, for (a Prometheus duration), severity (critical or
    # warning) and threshold (for alerts that have one). Unknown names fail
    # the render.
    rules: {}

# resources follows the bjw-s common library schema
# (https://github.com/bjw-s-labs/helm-charts/tree/main/charts/library/common)
# and is deep-merged over what the chart computes; your values win.
#
# The chart computes only what the server needs to run correctly, and sets
# no scheduling or capacity policy (no PodDisruptionBudget, container
# resources or topology spread constraints): your values are merged over
# what it computes, so anything it set could be changed but not removed.
#   - controllers.main: the server Deployment, named after the release. 2
#     replicas, RollingUpdate with maxUnavailable 0 and maxSurge 1, startup
#     and liveness probes on /healthz and a readiness probe on /readyz
#     (metrics port), terminationGracePeriodSeconds derived from
#     config.server.shutdownDelay and shutdownTimeout (45 by default), and
#     non-root (65532) with a read-only root filesystem and no capabilities.
#   - controllers.export: the export CronJob <release>-export (when
#     config.export.enabled), with the same security context,
#     concurrencyPolicy Forbid, backoffLimit 2 and
#     config.export.activeDeadlineSeconds.
#   - service.main: one Service with port "http" (8080, primary: ingress and
#     route backends resolve to it), port "metrics" (9090) and port
#     "service-metrics" (9091); never route to either metrics port from
#     outside the cluster.
#   - serviceMonitor.main (when config.server.metrics.serviceMonitor.enabled),
#     with a second endpoint for port "service-metrics" when
#     config.server.metrics.serviceWide.enabled.
#   - route.main (when config.route.enabled).
#   - persistence entries for every Secret above and the export volume.
#
# For example, to run three replicas, pin the image, size the server and
# add a PodDisruptionBudget:
#   controllers:
#     main:
#       replicas: 3
#       containers:
#         main:
#           image:
#             repository: ghcr.io/soliddowant/vault-sync
#             tag: 1.2.3
#           resources:
#             requests: {cpu: 100m, memory: 128Mi}
#             limits: {memory: 512Mi}
#       podDisruptionBudget:
#         maxUnavailable: 1
#
# The server keeps no per-replica state (SPEC.md §12): do not add volumes
# to controllers.main that a replica writes to.
resources:
  controllers:
    main: {}
  # ingress is entirely yours; with one Service, its backend resolves to
  # port "http" without naming a Service.
  ingress: {}
