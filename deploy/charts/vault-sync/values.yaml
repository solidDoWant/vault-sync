---
# vault-sync Helm chart values. The `# --` comments below are the
# documentation of each value: helm-docs renders them, with
# chart-values.md.gotmpl, into docs/admin/chart-values.md (make generate-docs).
# docs/admin/install.md walks through a full deployment, and
# docs/admin/configuration-reference.md describes every VAULT_SYNC_* variable
# the values below set.
#
# `config` is this chart's own interface: the chart turns it into the server
# Deployment ("main"), the export CronJob ("export"), their Services, Secret
# mounts and environment. `resources` is passed to the bjw-s common library
# chart and deep-merged over what the chart computes, so anything the library
# supports can be overridden or added there.
#
# Secrets are never created by this chart: every credential is a reference to
# a Secret you create (for example with cert-manager, CloudNativePG or
# external-secrets). Only the named keys of each Secret are projected into
# the pods, as a directory (never with subPath), so a rotated Secret reaches
# the running pods without a restart.
config:
  # -- `VAULT_SYNC_LOG_LEVEL` for the server and the export job: `debug`,
  # `info`, `warn` or `error`.
  # @default -- null (`info`)
  # @section -- Shared settings
  logLevel: null

  # The export job uses the same database settings unless
  # config.export.database overrides them.
  database:
    url:
      # -- `VAULT_SYNC_DATABASE_URL` as a plain value: a `postgres://` URL or
      # libpq keyword/value string, without `sslcert`/`sslkey`. Use it only if
      # it holds no password. Required, unless
      # `config.database.url.secretKeyRef` is set; setting both fails the
      # render.
      # @default -- empty
      # @section -- PostgreSQL
      value: ""
      secretKeyRef:
        # -- Secret holding `VAULT_SYNC_DATABASE_URL`. Set together with
        # `config.database.url.secretKeyRef.key`.
        # @default -- empty
        # @section -- PostgreSQL
        name: ""
        # -- Key of that Secret.
        # @default -- empty
        # @section -- PostgreSQL
        key: ""
    tls:
      clientCertificate:
        # -- Secret with the PostgreSQL client certificate and key, for
        # example a `kubernetes.io/tls` Secret from cert-manager or the one
        # CloudNativePG creates for a user. Mounted at
        # `/etc/vault-sync/database-client-cert`. It sets
        # `VAULT_SYNC_DATABASE_TLS_CERT_FILE` and
        # `VAULT_SYNC_DATABASE_TLS_KEY_FILE`.
        # @default -- empty
        # @section -- PostgreSQL
        secretName: ""
        # -- Key of the certificate in that Secret.
        # @section -- PostgreSQL
        certKey: tls.crt
        # -- Key of the private key in that Secret.
        # @section -- PostgreSQL
        keyKey: tls.key
      caCert:
        secretKeyRef:
          # -- Secret with the CA bundle that signs the PostgreSQL server
          # certificate (for CloudNativePG, the `<cluster>-ca` Secret, key
          # `ca.crt`). Mounted at `/etc/vault-sync/database-ca` (server and
          # export). It sets `VAULT_SYNC_DATABASE_TLS_CA_FILE`, which turns on
          # full verification ([PostgreSQL TLS](postgresql-and-s3.md#postgresql-tls)).
          # @default -- empty
          # @section -- PostgreSQL
          name: ""
          # -- Key of the CA bundle in that Secret.
          # @section -- PostgreSQL
          key: ca.crt

  # s3 configures the object store holding file contents.
  s3:
    # -- `VAULT_SYNC_S3_BUCKET`. Required. The bucket must exist.
    # @default -- empty
    # @section -- S3
    bucket: ""
    # -- `VAULT_SYNC_S3_ENDPOINT`, for example the Ceph RGW URL.
    # @default -- null (AWS S3)
    # @section -- S3
    endpoint: null
    # -- `VAULT_SYNC_S3_REGION`.
    # @default -- null (`us-east-1`)
    # @section -- S3
    region: null
    # -- `VAULT_SYNC_S3_FORCE_PATH_STYLE`, a boolean.
    # @default -- null (`true`)
    # @section -- S3
    forcePathStyle: null
    # -- `VAULT_SYNC_S3_IDLE_TIMEOUT`, a Go duration.
    # @default -- null (`2m`)
    # @section -- S3
    idleTimeout: null
    credentials:
      # -- Secret with the S3 access key id and secret access key. Mounted at
      # `/etc/vault-sync/s3-credentials`. It sets
      # `VAULT_SYNC_S3_ACCESS_KEY_ID_FILE` and
      # `VAULT_SYNC_S3_SECRET_ACCESS_KEY_FILE`. Required. The default keys
      # match the Secret that Rook creates for an ObjectBucketClaim.
      # @default -- empty
      # @section -- S3
      secretName: ""
      # -- Key of the access key id in that Secret.
      # @section -- S3
      accessKeyIdKey: AWS_ACCESS_KEY_ID
      # -- Key of the secret access key in that Secret.
      # @section -- S3
      secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
    caCert:
      secretKeyRef:
        # -- Secret with a CA bundle for the S3 endpoint, instead of the
        # system roots. Mounted at `/etc/vault-sync/s3-ca` (server and
        # export). It sets `VAULT_SYNC_S3_TLS_CA_FILE`.
        # @default -- empty (system roots)
        # @section -- S3
        name: ""
        # -- Key of the CA bundle in that Secret.
        # @section -- S3
        key: ca.crt

  # oidc configures access-token validation
  # (docs/admin/identity-provider.md).
  oidc:
    # -- `VAULT_SYNC_OIDC_ISSUER_URL`. Required. For example
    # `https://auth.example.com/application/o/vault-sync/` for Authentik.
    # @default -- empty
    # @section -- OIDC
    issuerUrl: ""
    # -- `VAULT_SYNC_OIDC_AUDIENCE`: the client ID of the vault-sync provider.
    # Required.
    # @default -- empty
    # @section -- OIDC
    audience: ""
    # -- `VAULT_SYNC_OIDC_CLIENT_ID`, the client the plugin signs in as when
    # it differs from the audience. null leaves it unset.
    # @default -- null
    # @section -- OIDC
    clientId: null

  # server holds the API server's tunables. Every null value leaves its
  # variable unset, so the server default applies
  # (docs/admin/configuration-reference.md).
  server:
    # -- `VAULT_SYNC_MAX_REQUEST_BYTES`. Keep it at or below the WAF's
    # inspected body limit (1 MiB by default).
    # @default -- null
    # @section -- Server
    maxRequestBytes: null
    # -- `VAULT_SYNC_WRITE_TIMEOUT`.
    # @default -- null
    # @section -- Server
    writeTimeout: null
    # -- `VAULT_SYNC_MAX_CONCURRENT_RPCS_PER_USER`.
    # @default -- null
    # @section -- Server
    maxConcurrentRpcsPerUser: null
    # -- `VAULT_SYNC_SHUTDOWN_DELAY`.
    # @default -- null
    # @section -- Server
    shutdownDelay: null
    # -- `VAULT_SYNC_SHUTDOWN_TIMEOUT`. The chart sets the pod's
    # `terminationGracePeriodSeconds` to the delay plus the timeout (5s + 30s
    # when unset) plus 10 seconds, and at least 45. It refuses to render if an
    # explicit `resources.controllers.main.pod.terminationGracePeriodSeconds`
    # is not larger than their sum.
    # @default -- null
    # @section -- Server
    shutdownTimeout: null
    blob:
      # -- `VAULT_SYNC_BLOB_MAX_CHUNK_BYTES`.
      # @default -- null
      # @section -- Server
      maxChunkBytes: null
      # -- `VAULT_SYNC_BLOB_MAX_SIZE_BYTES`.
      # @default -- null
      # @section -- Server
      maxSizeBytes: null
      # -- `VAULT_SYNC_BLOB_MAX_UPLOADS_PER_VAULT`.
      # @default -- null
      # @section -- Server
      maxUploadsPerVault: null
      # -- `VAULT_SYNC_BLOB_UPLOAD_TTL`.
      # @default -- null
      # @section -- Server
      uploadTtl: null
      # -- `VAULT_SYNC_BLOB_UPLOAD_RECLAIM_IDLE`.
      # @default -- null
      # @section -- Server
      uploadReclaimIdle: null
      # -- `VAULT_SYNC_BLOB_GC_GRACE`.
      # @default -- null
      # @section -- Server
      gcGrace: null
    retention:
      # -- `VAULT_SYNC_RETENTION_KEEP_ALL`.
      # @default -- null
      # @section -- Server
      keepAll: null
      # -- `VAULT_SYNC_RETENTION_KEEP_DAILY`.
      # @default -- null
      # @section -- Server
      keepDaily: null
      # -- `VAULT_SYNC_RETENTION_PURGE_MARKER_HORIZON`.
      # @default -- null
      # @section -- Server
      purgeMarkerHorizon: null
      # -- `VAULT_SYNC_RETENTION_OVERRIDE_MIN_KEEP_ALL`. Only the
      # `retention set` subcommand, run in a server pod, reads it
      # ([Per-vault overrides](history-and-retention.md#per-vault-overrides)).
      # @default -- null
      # @section -- Server
      overrideMinKeepAll: null
      # -- `VAULT_SYNC_RETENTION_OVERRIDE_MIN_KEEP_DAILY`. Likewise read only
      # by `retention set`.
      # @default -- null
      # @section -- Server
      overrideMinKeepDaily: null
    realtime:
      # -- `VAULT_SYNC_REALTIME_MAX_CONNECTIONS`.
      # @default -- null
      # @section -- Server
      maxConnections: null
      # -- `VAULT_SYNC_REALTIME_MAX_CONNECTIONS_PER_USER`.
      # @default -- null
      # @section -- Server
      maxConnectionsPerUser: null
      # -- `VAULT_SYNC_REALTIME_MAX_SUBSCRIPTIONS`.
      # @default -- null
      # @section -- Server
      maxSubscriptions: null
    escrow:
      # -- `VAULT_SYNC_ESCROW_RECIPIENT`: the escrow public key, an age hybrid
      # recipient (`age1pq1…`), a string. It is public. the escrow private key
      # goes into the export job only (`config.export.escrow`).
      # @default -- null
      # @section -- Server
      recipient: null
      # -- `VAULT_SYNC_ESCROW_SIGNING_KEY`: the escrow signing public key
      # (base64 Ed25519), a string, set together with `recipient`. It is
      # public. its private key stays with the escrow identity.
      # @default -- null
      # @section -- Server
      signingKey: null
      # -- `VAULT_SYNC_ESCROW_DEFAULT`, a boolean: whether new encrypted
      # vaults have escrow unless their owner turns it off.
      # @default -- null (`true`)
      # @section -- Server
      default: null
      # -- `VAULT_SYNC_ESCROW_RETIRING_KEY_IDS`: comma-separated ids of escrow
      # keys being rotated away from, which escrow slots can still name until
      # `export rotate-escrow` has re-wrapped them all
      # ([Rotate the escrow key](encryption.md#rotate-the-escrow-key)).
      # @default -- null
      # @section -- Server
      retiringKeyIds: null
    metrics:
      serviceMonitor:
        # -- Create a prometheus-operator ServiceMonitor scraping `/metrics`
        # on port `metrics` (9090) of the Service. Needs the
        # `monitoring.coreos.com` CRDs.
        # @section -- Metrics
        enabled: false
        # -- Scrape interval.
        # @section -- Metrics
        interval: 1m
        # -- Scrape timeout.
        # @section -- Metrics
        scrapeTimeout: 10s
      serviceWide:
        # -- Add a second ServiceMonitor endpoint scraping the service-wide
        # `/metrics` on port `service-metrics` (9091), with the same interval
        # and timeout. Needs `config.server.metrics.serviceMonitor.enabled`.
        # Every replica serves the same values. to scrape only one replica,
        # configure that in your scraper.
        # @section -- Metrics
        enabled: false
        # -- `VAULT_SYNC_SERVICE_METRICS_INTERVAL`: how often each replica
        # reads the service-wide metrics from PostgreSQL.
        # @default -- null
        # @section -- Metrics
        interval: null

  # export configures the plaintext export CronJob
  # (docs/admin/backup-and-restore.md). It runs
  # `vault-sync-server export -out /export/<directory>` with its own Secret
  # mounts; the server Deployment never mounts the export's output or its
  # escrow key.
  export:
    # -- Render the export CronJob. Off by default, so a minimal install needs
    # only the database, S3 and OIDC settings. Turning it on is recommended:
    # the export is the plaintext disaster-recovery copy of every vault.
    # @section -- Export
    enabled: false
    # -- Cron schedule.
    # @section -- Export
    schedule: "0 3 * * *"
    # -- IANA time zone of the schedule. Empty uses the cluster's default.
    # @default -- empty
    # @section -- Export
    timeZone: ""
    # -- Upper bound, in seconds, on one export run (the Job's
    # `activeDeadlineSeconds`, 6 hours by default). It must be positive. Runs
    # never overlap (`concurrencyPolicy: Forbid`), so a hung export, for
    # example on a stalled NFS volume, would otherwise block every later run.
    # @section -- Export
    activeDeadlineSeconds: 21600
    output:
      # -- The output volume, as a bjw-s persistence item (`type`,
      # `existingClaim`, `server`/`path` for `nfs`, ...), for example
      # `{type: persistentVolumeClaim, existingClaim: vault-sync-export}`, or
      # an `nfs` or `hostPath` volume that your tape-archival tooling reads.
      # Required while the export is enabled. Mounted at `/export` in the
      # export job only; mount options other than the path can be set here.
      # @section -- Export
      persistence: {}
      # -- Directory inside the volume, a single name. The job runs
      # `export -out /export/<directory>`. The export replaces it on every
      # run and keeps a lock file and a staging directory beside it, at the
      # top of the volume.
      # @section -- Export
      directory: vaults
    # database overrides config.database for the export, so it can use its
    # own read-only role. Empty fields fall back to config.database; the CA
    # is always shared.
    database:
      url:
        # -- The export's own `VAULT_SYNC_DATABASE_URL`, for example for a
        # read-only role ([the grants it needs](backup-and-restore.md)).
        # Empty uses the server's. Exclusive with
        # `config.export.database.url.secretKeyRef`.
        # @default -- empty
        # @section -- Export
        value: ""
        secretKeyRef:
          # -- Secret holding the export's database URL.
          # @default -- empty
          # @section -- Export
          name: ""
          # -- Key of that Secret.
          # @default -- empty
          # @section -- Export
          key: ""
      tls:
        clientCertificate:
          # -- The export's own PostgreSQL client certificate Secret, mounted
          # at `/etc/vault-sync/export-database-client-cert`. Empty uses the
          # server's. The CA (`config.database.tls.caCert`) is always shared.
          # @default -- empty
          # @section -- Export
          secretName: ""
          # -- Key of the certificate.
          # @section -- Export
          certKey: tls.crt
          # -- Key of the private key.
          # @section -- Export
          keyKey: tls.key
    s3:
      credentials:
        # -- The export's own S3 credentials Secret, for example read-only
        # credentials, mounted at `/etc/vault-sync/export-s3-credentials`. Empty uses `config.s3.credentials`. The bucket, endpoint and CA are
        # shared.
        # @default -- empty
        # @section -- Export
        secretName: ""
        # -- Key of the access key id.
        # @section -- Export
        accessKeyIdKey: AWS_ACCESS_KEY_ID
        # -- Key of the secret access key.
        # @section -- Export
        secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
    escrow:
      # -- Secret holding the escrow identity (SPEC.md §9.4), mounted
      # read-only at `/etc/vault-sync/escrow` in the export job only, never in
      # the server. The export job reads it to decrypt escrowed vaults. The
      # escrow signing keys never go into the cluster: they stay offline and
      # are used only by a manual escrow key rotation (`export rotate-escrow`,
      # [Rotate the escrow key](encryption.md#rotate-the-escrow-key)), and the
      # chart refuses to render if any controller would get them.
      # @default -- empty
      # @section -- Export
      secretName: ""
      # -- Key of that Secret. It holds the identity file (`age-keygen -pq`
      # output; both identities during an escrow key rotation), which the
      # export job reads as `VAULT_SYNC_ESCROW_IDENTITY_FILE`. The chart
      # refuses to render if any value would put it into the server.
      # @section -- Export
      key: escrow.key
  escrowJobToken:
    # -- Secret holding the static bearer token of the escrow rotation
    # endpoint (`VAULT_SYNC_ESCROW_JOB_TOKEN_FILE`), mounted read-only at
    # `/etc/vault-sync/escrow-job-token` into the server, which checks it, and
    # the export job, which presents it, and into nothing else. Empty leaves
    # the endpoint off.
    # @default -- empty
    # @section -- Export
    secretName: ""
    # -- Key of that Secret. It holds one line of at least 32 characters, for
    # example `openssl rand -base64 32`.
    # @section -- Export
    key: token

  # route renders a Gateway API HTTPRoute (through bjw-s `route.main`); see
  # the Route section of docs/admin/chart-values.md for its rules and
  # timeouts.
  route:
    # -- Render the HTTPRoute.
    # @section -- Route
    enabled: false
    # -- Hostnames it matches, for example `[sync.example.com]`.
    # @section -- Route
    hostnames: []
    # -- The Gateway (and listener) to attach to, as Gateway API `parentRefs`
    # (`name`, `namespace`, `sectionName`, ...), for example
    # `[{name: internet-gateway, namespace: gateway, sectionName: https}]`.
    # @section -- Route
    parentRefs: []
    # -- Annotations of the HTTPRoute.
    # @section -- Route
    annotations: {}
    # -- Labels of the HTTPRoute.
    # @section -- Route
    labels: {}

  grafana:
    dashboards:
      # -- Render one grafana-operator `GrafanaDashboard`
      # (`grafana.integreatly.org/v1beta1`) per dashboard, named
      # `<release>-dashboard-<name>`. Needs the grafana-operator CRDs.
      # @section -- Grafana dashboards
      enabled: false
      # -- Label selector of the `Grafana` resources to import into, for
      # example `{matchLabels: {dashboards: grafana}}`. Required while
      # `config.grafana.dashboards.enabled`.
      # @section -- Grafana dashboards
      instanceSelector: {}
      # -- Title of the Grafana folder to put the dashboards in. At most one
      # of `folder`, `folderRef` and `folderUID`. Setting  more fails the
      # render.
      # @default -- empty
      # @section -- Grafana dashboards
      folder: ""
      # -- Name of a `GrafanaFolder` in the release namespace to put the
      # dashboards in.
      # @default -- empty
      # @section -- Grafana dashboards
      folderRef: ""
      # -- UID of an existing Grafana folder to put the dashboards in.
      # @default -- empty
      # @section -- Grafana dashboards
      folderUID: ""
      # -- How often the operator re-applies the dashboards, for example
      # `10m`.
      # @default -- null (the operator's default)
      # @section -- Grafana dashboards
      resyncPeriod: null
      # -- Let `Grafana` instances in other namespaces import the dashboards.
      # @default -- null (`false`)
      # @section -- Grafana dashboards
      allowCrossNamespaceImport: null
      # -- Extra labels of each `GrafanaDashboard`.
      # @section -- Grafana dashboards
      labels: {}
      configMaps:
        # -- Render each dashboard as a ConfigMap `<release>-dashboard-<name>`
        # holding `<name>.json`, for the Grafana chart's dashboard sidecar, for
        # deployments without the operator. Independent of
        # `config.grafana.dashboards.enabled`.
        # @section -- Grafana dashboards
        enabled: false
        # -- Label the sidecar watches (the Grafana chart's
        # `sidecar.dashboards.label`).
        # @section -- Grafana dashboards
        label: grafana_dashboard
        # -- Value of that label (`sidecar.dashboards.labelValue`).
        # @section -- Grafana dashboards
        labelValue: "1"
        # -- Annotations of each ConfigMap, for example
        # `{grafana_folder: vault-sync}` with the sidecar's
        # `folderAnnotation` to choose a folder.
        # @section -- Grafana dashboards
        annotations: {}

  alerts:
    prometheusRule:
      # -- Render the PrometheusRule. Needs the `monitoring.coreos.com` CRDs.
      # @section -- Alerts
      enabled: false
      # -- Extra labels of the PrometheusRule, for example the ones your
      # Prometheus's `ruleSelector` matches.
      # @section -- Alerts
      labels: {}
      # -- Annotations of the PrometheusRule.
      # @section -- Alerts
      annotations: {}
      selector:
        # -- The `namespace` matcher added to every expression. `null` uses
        # the release namespace; an empty string leaves the matcher out.
        # @default -- `null`
        # @section -- Alerts
        namespace: null
        # -- The `job` matcher added to every expression that reads
        # vault-sync's own metrics. `null` uses the Service name (the release
        # name, the ServiceMonitor's `job` label), and an empty string leaves the
        # matcher out. The kube-state-metrics alerts match the namespace and
        # the Deployment name instead.
        # @default -- `null`
        # @section -- Alerts
        job: null
    # -- Each alert's `runbook_url` annotation is this followed by `#` and the
    # alert's name in lower case. Empty leaves `runbook_url` out.
    # @section -- Alerts
    runbookUrlBase: https://github.com/solidDoWant/vault-sync/blob/master/docs/admin/alerts.md
    # -- Per-alert overrides keyed by alert name, each with `enabled`, `for` (a
    # Prometheus duration), `severity` (`critical` or `warning`) and
    # `threshold` (for alerts that have one, see  [Alerts](alerts.md)). A
    # disabled alert is dropped from the rendered rules, and an unknown name
    # fails the render. `VaultSyncNoReplicaReady` and
    # `VaultSyncReplicasUnavailable` need kube-state-metrics and are off
    # unless enabled here. `VaultSyncExportNotSucceeding` is on while
    # `config.export.enabled`.
    # @section -- Alerts
    rules: {}

# resources follows the bjw-s common library schema and is deep-merged over
# what the chart computes; your values win. The Overriding the computed
# resources section of docs/admin/chart-values.md lists what the chart
# computes.
resources:
  controllers:
    # -- Overrides of the server Deployment, merged over what the chart
    # computes, for example `replicas`, `podDisruptionBudget` or
    # `containers.main.resources`.
    # @section -- Overriding the computed resources
    main: {}
  # -- An Ingress, entirely yours. With  one Service, its backend resolves to
  # port `http` without naming a Service.
  # @section -- Overriding the computed resources
  ingress: {}
