# Override for deploy/compose/compose.test.yaml: runs the test stack on
# PostgreSQL 14, the minimum supported version (SPEC.md §3, §12). Applied by
# scripts/with-test-stack.sh when VAULT_SYNC_TEST_POSTGRES_VERSION=14, which
# `make test-integration-postgres14` and the integration-postgres14 CI job
# set. Everything except the image comes from compose.test.yaml. Keep this on
# major version 14 (Renovate is told not to propose majors for this file, and
# with-test-stack.sh fails if the server reports another major version).
services:
  postgres:
    image: postgres:14.24-alpine@sha256:4ea9e5ed06591da7ea23eb65465e8d3187fe79f4d5ec3ae976d29a33b013e77a
