# Throwaway dependencies for `make test-integration` (scripts/test-integration.sh).
# Not a deployment: data lives on tmpfs, durability is disabled for speed, and
# the credentials are fixed test values. Host ports are ephemeral and bound to
# loopback so parallel runs (one compose project each) never collide.
#
# No image is pulled from Docker Hub (registry-1.docker.io), whose outages and
# rate limits used to fail CI (#606): every image comes from Google's Docker
# Hub mirror, mirror.gcr.io, which serves the same content (same digests).
# Not ECR Public: its anonymous data limit is exhausted on GitHub's shared
# runner IPs. scripts/with-test-stack.sh also retries the pull with backoff
# (scripts/test-images.sh), and CI caches the images (.github/actions/test-images,
# #727).
name: vault-sync-test

services:
  postgres:
    image: mirror.gcr.io/library/postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: vault_sync
      POSTGRES_PASSWORD: vault_sync
      POSTGRES_DB: vault_sync
    command: [postgres, -c, fsync=off, -c, full_page_writes=off, -c, synchronous_commit=off]
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      # TCP, not the socket: the entrypoint's init-time server only listens
      # on the socket, so this turns healthy once the real server is up.
      test: [CMD, pg_isready, --host=127.0.0.1, --username=vault_sync, --dbname=vault_sync]
      interval: 1s
      timeout: 3s
      retries: 60

  # S3-compatible store. MinIO no longer publishes images; versitygw is a
  # single static binary serving S3 from a POSIX directory.
  s3:
    image: mirror.gcr.io/versity/versitygw:v1.9.0@sha256:eb7f786fcd91e72194e48fcf1ac16302d686bf8e3a71434bdbc067a6efd3fdc7
    environment:
      ROOT_ACCESS_KEY_ID: vault-sync-test
      ROOT_SECRET_ACCESS_KEY: vault-sync-test-secret
      VGW_REGION: us-east-1
    command: [--port, ":7070", posix, /data]
    tmpfs:
      - /data
    ports:
      - "127.0.0.1::7070"
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, "7070"]
      interval: 1s
      timeout: 3s
      retries: 60
